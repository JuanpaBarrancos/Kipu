function leerCuota(f){
  const g = n => parseMonto(f.elements[n].value);
  return {monto:g('monto'), tasa:g('tasa'), plazo:Math.round(g('plazo')), sobra:g('sobra'), actuales:Math.max(0, g('actuales') || 0), limite:g('limite') > 0 ? g('limite') : 50};
}
function cuotaResHTML(v){
  if (!v || !(v.monto > 0) || !(v.plazo > 0) || !Number.isFinite(v.tasa) || v.tasa < 0) return '<div class="res"><p class="cap">Resultado</p><p class="big">Escribe monto, tasa y plazo</p><p>Te muestro la cuota mensual y si cabe en lo que te sobra.</p></div>';
  const c = cuotaFrancesa(v.monto, v.tasa, v.plazo), total = c * v.plazo;
  const disp = Number.isFinite(v.sobra) ? v.sobra - v.actuales : NaN;
  let tone = 'res', titulo, texto;
  if (!Number.isFinite(disp)) { titulo = 'Cuota de ' + fmt(c) + ' al mes'; texto = 'Escribe cuánto te sobra al mes para saber si la puedes pagar.'; }
  else if (disp <= 0) { tone = 'res malo'; titulo = 'Hoy no te sobra para otra cuota'; texto = 'Después de tus cuotas actuales no queda plata libre. Una cuota de ' + fmt(c) + ' tendría que salir de tu capital o de la casa.'; }
  else {
    const ratio = c / disp * 100;
    if (ratio > v.limite) { tone = 'res malo'; titulo = 'La cuota se come el ' + pct(ratio) + ' de lo que te sobra'; texto = 'Pasa tu límite de ' + pct(v.limite) + '. Prueba con menos monto o más plazo.'; }
    else if (ratio > v.limite * 0.75) { tone = 'res medio'; titulo = 'Cabe, pero justo'; texto = 'La cuota usa el ' + pct(ratio) + ' de lo que te sobra. Un mes malo te puede dejar sin margen.'; }
    else { tone = 'res bueno'; titulo = 'La cuota cabe'; texto = 'Usa el ' + pct(ratio) + ' de lo que te sobra, dentro de tu límite de ' + pct(v.limite) + '.'; }
  }
  return '<div class="' + tone + '"><p class="cap">Préstamo de ' + fmt(v.monto) + ' a ' + v.plazo + ' meses</p><p class="big">' + titulo + '</p><p>' + texto + '</p>' +
    '<dl class="kv"><dt>Cuota mensual</dt><dd>' + fmt(c) + '</dd><dt>Total que pagarías</dt><dd>' + fmt(total) + '</dd><dt>De eso, intereses</dt><dd>' + fmt(total - v.monto) + '</dd>' +
    (Number.isFinite(disp) ? '<dt>Te queda libre hoy</dt><dd>' + fmt(disp) + '</dd>' : '') + '</dl>' +
    '<p class="note" style="margin-top:10px">Cálculo con cuota fija. El banco puede sumar seguros o comisiones; revisa tu plan de pagos.</p></div>';
}

/* ---------- Indicadores del piloto ---------- */
function textoPiloto(x, conNombre){
  const pc = (a, b) => b > 0 ? Math.round(a / b * 100) + '%' : 'sin datos';
  const l = ['Indicadores Kipu' + (conNombre && S.perfil ? ', ' + S.perfil.nombre : '') + (S.perfil && S.perfil.rubro ? ' (' + S.perfil.rubro.toLowerCase() + ')' : ''),
    'Periodo: ' + fechaNum(x.desde) + ' al ' + fechaNum(x.hasta) + ' (' + x.dias + ' días)',
    'Días con algo anotado: ' + x.diasAnotados,
    'Cierres del día: ' + x.cierres + ' de unos ' + x.abiertos + ' días abiertos (' + pc(x.cierres, x.abiertos) + ')',
    'Días con la plata para reponer cubierta: ' + x.cubiertos + ' de ' + x.dias + ' (' + pc(x.cubiertos, x.dias) + ')',
    'Capital de trabajo: ' + fmt(x.capital0) + ' al inicio, ' + fmt(x.capital1) + ' hoy'];
  if (x.tope > 0) l.push('Semanas dentro del tope para la casa: ' + x.semOk + ' de ' + x.semanas);
  l.push('Ventas anotadas: ' + fmt(x.ventas) + ' (promedio ' + fmt(x.ventasDia) + ' por día anotado)');
  l.push('Ganancia estimada: ' + fmt(x.ganancia));
  if (x.fiado || x.cobro) l.push('Fiado: dio ' + fmt(x.fiado) + ', cobró ' + fmt(x.cobro) + (x.perdido ? ', perdió ' + fmt(x.perdido) : ''));
  l.push('Deudas activas: ' + x.deudas + (x.caras ? ', de las cuales ' + x.caras + ' cuestan más de 5% al mes' : ''));
  l.push('Racha actual de cierres: ' + x.racha + (x.racha === 1 ? ' día' : ' días'));
  if (x.opinion) l.push('Si ya no pudiera usar Kipu: ' + OPINIONES[x.opinion.v].toLowerCase());
  if (x.recomendaciones) l.push('Veces que recomendó Kipu: ' + x.recomendaciones);
  l.push('Sin datos de clientes, NIT ni impuestos.');
  if (S.ajustes.consentimiento) l.push('Consentimiento dado el ' + fechaNum(S.ajustes.consentimiento) + ' (versión ' + CONSENTIMIENTO_V + ').');
  return l.join('\n');
}

function contarDelim(linea, d){ let n = 0, q = false; for (const ch of linea) { if (ch === '"') q = !q; else if (ch === d && !q) n++; } return n; }
function parseCSV(text){
  text = String(text).replace(/^﻿/, '');
  const primera = text.split(/\r?\n/).find(l => l.trim()) || '';
  let delim = ',', best = -1;
  [';', ',', '\t', '|'].forEach(c => { const n = contarDelim(primera, c); if (n > best) { best = n; delim = c; } });
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch; }
    else if (ch === '"') q = true;
    else if (ch === delim) { row.push(cell); cell = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += ch;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return rows.map(r => r.map(c => c.trim())).filter(r => r.some(c => c !== ''));
}
function prepararImport(texto, nombre){
  const rows = parseCSV(texto);

  const f0 = rows[0];
  const header = !f0.some(c => parseFecha(c)) && f0.some(c => c && !Number.isFinite(parseMonto(c)));
  const imp = {nombre, rows, header, formato:'una', map:{}, tipoE:'venta', tipoS:'gasto', agrupar:true, personalModo:'aporte', reglas:S.ajustes.reglasPersonal || '', cambios:{}};
  adivinar(imp);
  return imp;
}
function adivinar(imp){
  const head = imp.header ? imp.rows[0].map(h => String(h).toLowerCase()) : [];
  const n = Math.max.apply(null, imp.rows.map(r => r.length));
  const ini = imp.header ? 1 : 0, muestra = imp.rows.slice(ini, ini + 25);
  const score = (j, fn) => muestra.filter(r => fn(r[j])).length;
  const m = {fecha:-1, monto:-1, desc:-1, entrada:-1, salida:-1};
  head.forEach((h, j) => {
    if (m.fecha < 0 && /fecha|date/.test(h)) m.fecha = j;
    else if (m.desc < 0 && /desc|concepto|detalle|glosa|referencia|motivo|nombre/.test(h)) m.desc = j;
    else if (m.entrada < 0 && /abono|cr[eé]dito|ingreso|entrada|haber|dep[oó]sito/.test(h)) m.entrada = j;
    else if (m.salida < 0 && /cargo|d[eé]bito|egreso|salida|retiro/.test(h)) m.salida = j;
    else if (m.monto < 0 && /monto|importe|amount|valor|total/.test(h)) m.monto = j;
  });
  if (m.fecha < 0) for (let j = 0; j < n; j++) if (score(j, v => !!parseFecha(v)) >= muestra.length * 0.6) { m.fecha = j; break; }
  if (m.monto < 0 && !(m.entrada >= 0 && m.salida >= 0))
    for (let j = 0; j < n; j++) { if (j === m.fecha || j === m.desc) continue; if (score(j, v => v !== '' && Number.isFinite(parseMonto(v))) >= muestra.length * 0.6) { m.monto = j; break; } }
  if (m.desc < 0)
    for (let j = 0; j < n; j++) { if (j === m.fecha || j === m.monto || j === m.entrada || j === m.salida) continue; if (score(j, v => v && !Number.isFinite(parseMonto(v)) && !parseFecha(v)) >= muestra.length * 0.5) { m.desc = j; break; } }
  imp.formato = (m.monto < 0 && m.entrada >= 0 && m.salida >= 0) ? 'dos' : 'una';
  imp.map = m;
}
const sinAcentos = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
const listaReglas = txt => String(txt || '').split(/[,;\n]/).map(x => sinAcentos(x).trim()).filter(x => x.length >= 2);
function impCandidatos(imp){
  const filas = []; let invalidos = 0;
  const reglas = listaReglas(imp.reglas);
  for (let i = imp.header ? 1 : 0; i < imp.rows.length; i++) {
    const row = imp.rows[i];
    const fecha = imp.map.fecha >= 0 ? parseFecha(row[imp.map.fecha]) : null;
    let monto;
    if (imp.formato === 'una') monto = imp.map.monto >= 0 ? parseMonto(row[imp.map.monto]) : NaN;
    else {
      const e = imp.map.entrada >= 0 ? parseMonto(row[imp.map.entrada]) : NaN, s = imp.map.salida >= 0 ? parseMonto(row[imp.map.salida]) : NaN;
      monto = (Number.isFinite(e) ? Math.abs(e) : 0) - (Number.isFinite(s) ? Math.abs(s) : 0);
      if (!Number.isFinite(e) && !Number.isFinite(s)) monto = NaN;
    }
    if (!fecha || !Number.isFinite(monto) || monto === 0) { invalidos++; continue; }
    const desc = imp.map.desc >= 0 ? String(row[imp.map.desc] || '').slice(0, 140) : '';

    const personal = imp.cambios[i] != null ? imp.cambios[i] === 'personal' : auto;
    let tipo;
    if (personal) tipo = imp.personalModo === 'ignorar' ? 'ignorar' : monto > 0 ? 'aporte' : 'retiro';
    else tipo = monto > 0 ? imp.tipoE : imp.tipoS;
    filas.push({i, fecha, monto:r2(Math.abs(monto)), entra:monto > 0, tipo, desc, personal});
  }
  const existentes = new Set(S.movs.map(m => m.fecha + '|' + m.monto + '|' + m.tipo + '|' + m.nota));
  const nuevos = []; let repetidos = 0, omitCierre = 0;
  const grupos = new Map();
  filas.forEach(f => {
    if (f.tipo === 'ignorar') return;
    if (f.tipo === 'venta' && cierreDe(f.fecha)) { omitCierre++; return; }
    if (imp.agrupar && f.tipo === 'venta') {
      if (!grupos.has(f.fecha)) grupos.set(f.fecha, {fecha:f.fecha, monto:0, tipo:'venta', n:0});
      const g = grupos.get(f.fecha); g.monto = r2(g.monto + f.monto); g.n++;

    }
    nuevos.push({fecha:f.fecha, monto:f.monto, tipo:f.tipo, desc:f.desc});
  });
  grupos.forEach(g => nuevos.push({fecha:g.fecha, monto:g.monto, tipo:'venta', desc:g.n === 1 ? 'Cobro por QR' : g.n + ' cobros por QR del día'}));
  const finales = nuevos.filter(c => { const k = c.fecha + '|' + c.monto + '|' + c.tipo + '|' + c.desc; if (existentes.has(k)) { repetidos++; return false; } return true; });
  finales.sort((a, b) => a.fecha < b.fecha ? -1 : a.fecha > b.fecha ? 1 : 0);
  return {filas, nuevos:finales, invalidos, repetidos, omitCierre, nPersonal:filas.filter(f => f.personal).length};
}

function mostrarTexto(nombre, contenido){
  D = null;
  dlgBody.innerHTML = '<div class="dlg-head"><h2 id="dlg-t">Copia el contenido</h2><button type="button" class="icon-btn" data-dact="cerrar" aria-label="Cerrar">' + ic('cerrar') + '</button></div>' +
    '<p class="muted">En esta vista no se puede descargar el archivo. Copia el texto, pégalo en un archivo nuevo y guárdalo como <strong>' + esc(nombre) + '</strong>.</p>' +
    '<label class="campo"><span class="sr">Contenido</span><textarea id="txt-copia" readonly style="min-height:220px">' + esc(contenido.replace(/^﻿/, '')) + '</textarea></label>' +
    '<div class="dlg-acc"><button type="button" class="btn btn-pri" data-dact="copiar">Copiar</button><button type="button" class="btn btn-ghost" data-dact="cerrar">Cerrar</button></div>';
  abrirDlg();
}
function copiarTexto(texto, ok){
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(texto).then(() => toast(ok || 'Copiado'), () => mostrarTexto('resumen.txt', texto));
  else mostrarTexto('resumen.txt', texto);
}

/* Copia por WhatsApp u otra app: usa el menú de compartir del celular si permite archivos */
function archivoCopia(){
  try { return new File([JSON.stringify(S)], 'kipu-copia-' + hoyISO() + '.json', {type:'application/json'}); } catch (e) { return null; }
}
function puedeCompartirArchivo(){
  try { const f = archivoCopia(); return !!(f && navigator.canShare && navigator.canShare({files:[f]})); } catch (e) { return false; }
}
async function compartirCopia(){
  const f = archivoCopia();
  try {
    await navigator.share({files:[f], title:'Copia de Kipu', text:'Copia de mis datos de Kipu del ' + fechaNum(hoyISO()) + '. Para recuperarlos, abre Kipu, ve a Mis datos y elige Restaurar una copia.'});
    marcarCopia(); toast('Copia enviada');
  } catch (e) { if (!e || e.name !== 'AbortError') ofrecerArchivo(f ? f.name : 'kipu-copia.json', JSON.stringify(S, null, 1)).then(marcarCopia); }
}
function marcarCopia(){ S.ajustes.ultimaCopia = hoyISO(); guardar(); if (ruta() === 'datos' || ruta() === 'inicio') render(); }

/* =========================================================
   Diálogos: anotar movimiento, bolsillo, deuda y cliente
   ========================================================= */
function abrirDlg(){
  if (typeof dlg.showModal === 'function') { if (!dlg.open) dlg.showModal(); }
  else dlg.setAttribute('open', '');
}
function cerrarDlg(){ if (typeof dlg.close === 'function' && dlg.open) dlg.close(); else dlg.removeAttribute('open'); D = null; }
dlg.addEventListener('click', e => { if (e.target === dlg) cerrarDlg(); });
dlg.addEventListener('close', () => { D = null; });
const dlgHead = (titulo, atras) => '<div class="dlg-head">' + (atras ? '<button type="button" class="icon-btn" data-dact="atras" aria-label="Elegir otro tipo">' + ic('atras') + '</button>' : '') +
  '<h2 id="dlg-t">' + titulo + '</h2><button type="button" class="icon-btn" data-dact="cerrar" aria-label="Cerrar">' + ic('cerrar') + '</button></div>';
const campoErr = (err, k) => err[k] ? '<span class="err" id="e-' + k + '">' + esc(err[k]) + '</span>' : '';
const attrErr = (err, k) => err[k] ? ' aria-invalid="true" aria-describedby="e-' + k + '"' : '';
function enfocar(sel){ setTimeout(() => { const f = $(sel, dlgBody); if (f) f.focus(); }, 30); }

/* ---------- Anotar un movimiento ---------- */
function abrirAnotar(o){
  o = o || {};
  if (!S.perfil) { location.hash = '#inicio'; toast('Primero cuéntanos de tu negocio'); return; }
  if (o.id) {
    const m = S.movs.find(x => x.id === o.id); if (!m) return;
    D = {kind:'mov', id:m.id, tipo:m.tipo, montoTxt:numTxt(m.monto), medio:m.medio, cat:m.cat, cliente:m.cliente, fecha:m.fecha, nota:m.nota, fondo:m.fondo, deuda:m.deuda, costoTxt:m.costo != null ? numTxt(m.costo) : '', origen:m.origen, err:{}};
  } else {
    D = {kind:'mov', id:null, tipo:o.tipo || null, montoTxt:o.monto > 0 ? numTxt(o.monto) : '', medio:o.medio === 'qr' ? 'qr' : 'efectivo', cat:o.cat || '', cliente:o.cliente || '', fecha:isISO(o.fecha) ? o.fecha : hoyISO(), nota:o.nota || '', fondo:o.fondo || '', deuda:o.deuda || '', costoTxt:'', origen:'manual', entendido:o.entendido || '', err:{}};
    if (D.tipo === 'cuota' && D.deuda && !D.montoTxt) { const d = deudaPorId(D.deuda); if (d) D.montoTxt = numTxt(d.cuota); }
    if (D.tipo === 'cuota' && D.deuda && !D.fondo) { const f = S.fondos.find(x => x.deuda === D.deuda); if (f) D.fondo = f.id; }
    if (D.tipo === 'perdido' && D.cliente && !D.montoTxt) { const s = saldoCliente(D.cliente); if (s > 0) D.montoTxt = numTxt(s); }
    if (D.tipo === 'entrega' && D.cliente && !D.montoTxt) { const s = adelantoCliente(D.cliente); if (s > 0) D.montoTxt = numTxt(s); }
    if (D.tipo === 'apartar' && D.fondo && !D.montoTxt) { const f = fondoPorId(D.fondo); if (f && f.porDia > 0) D.montoTxt = numTxt(f.porDia); }
  }
  pintarDlg(); abrirDlg();
  enfocar(D.tipo ? '#d-monto' : '.tipo');
}
function leerDlg(){
  if (!D) return;
  const g = id => { const el = $('#' + id, dlgBody); return el ? el.value : null; };
  if (D.kind === 'mov') {
    if (!D.tipo) return;
    const map = {'d-monto':'montoTxt', 'd-cliente':'cliente', 'd-fecha':'fecha', 'd-nota':'nota', 'd-fondo':'fondo', 'd-deuda':'deuda', 'd-costo':'costoTxt'};
    for (const k in map) { const v = g(k); if (v != null) D[map[k]] = v; }
  } else if (D.kind === 'fondo') {
    const map = {'d-nombre':'nombre', 'd-meta':'metaTxt', 'd-frec':'frecuencia', 'd-pordia':'porDiaTxt'};
    for (const k in map) { const v = g(k); if (v != null) D[map[k]] = v; }
  } else if (D.kind === 'deuda') {
    const map = {'d-nombre':'nombre', 'd-tipo':'tipo', 'd-recibido':'recibidoTxt', 'd-cuota':'cuotaTxt', 'd-frec':'frecuencia', 'd-n':'nTxt', 'd-inicio':'inicio'};
    for (const k in map) { const v = g(k); if (v != null) D[map[k]] = v; }
    const si = $('#d-solo', dlgBody); if (si) D.soloInteres = si.checked;
    const rg = $('#d-reg', dlgBody); if (rg) D.registrar = rg.checked;
  } else if (D.kind === 'cliente') {
    const map = {'d-nombre':'nombre', 'd-grupo':'grupo', 'd-tel':'telefono', 'd-rapido':'rapidoTxt', 'd-tope':'topeTxt'};
    for (const k in map) { const v = g(k); if (v != null) D[map[k]] = v; }
  }
}
function pintarDlg(){
  if (!D) return;
  if (D.kind === 'fondo') return pintarFondo();
  if (D.kind === 'deuda') return pintarDeuda();
  if (D.kind === 'cliente') return pintarCliente();
  if (!D.tipo) {
    const bloque = (lista, titulo) => '<p class="tipos-sep">' + titulo + '</p>' + lista.map(k => {
      const t = TIPOS[k], dir = t.signo > 0 ? 'in' : t.signo < 0 ? 'out' : 'neu';
      return '<button type="button" class="tipo ' + dir + '" data-dact="tipo" data-v="' + k + '">' + ic(t.icon) + t.label + '</button>';
    }).join('');

    const frecuentes = cada ? ['venta','compra','gasto','retiro','fiado','cobro'] : ['compra','gasto','retiro','fiado','cobro','cambio'];

      (D.todos ? '' : '<div class="btn-row"><button type="button" class="btn btn-ghost" data-dact="todos">' + ic('puntos') + 'Más opciones: adelantos, bolsillos, préstamos y cuotas</button></div>') +
      (cada ? '' : '<p class="note" style="margin-top:10px">Las ventas no se anotan una por una: salen del <a href="#cierre" data-dact="cerrar">cierre del día</a>.</p>');
    return;
  }
  const t = TIPOS[D.tipo], err = D.err || {};
  let ayudaCli = '';
  if (D.cliente.trim()) {
    if (D.tipo === 'cobro' || D.tipo === 'perdido') { const s = saldoCliente(D.cliente, D.id); ayudaCli = s > 0 ? esc(D.cliente.trim()) + ' te debe ' + fmt(s) + '.' : esc(D.cliente.trim()) + ' no tiene fiado pendiente.'; }
    else if (D.tipo === 'entrega') { const s = adelantoCliente(D.cliente, D.id); ayudaCli = s > 0 ? esc(D.cliente.trim()) + ' dejó ' + fmt(s) + ' de adelanto.' : esc(D.cliente.trim()) + ' no tiene adelantos pendientes.'; }
  }
  const clientes = nombresClientes();
  const fondos = S.fondos;
  const optsFondo = (requerido) => (requerido ? '<option value="">Elige un bolsillo</option>' : '<option value="">No, de la plata libre</option>') +
    fondos.map(f => '<option value="' + esc(f.id) + '"' + (D.fondo === f.id ? ' selected' : '') + '>' + esc(f.nombre) + ' (tiene ' + fmt(saldoFondo(f.id, D.id)) + ')</option>').join('');
  const deudas = S.deudas.filter(d => d.activa || d.id === D.deuda);
  let campos = '<label class="campo"><span class="lbl">Monto en bolivianos</span><input id="d-monto" type="text" inputmode="decimal" class="monto" autocomplete="off" placeholder="0" value="' + esc(D.montoTxt) + '"' + attrErr(err, 'monto') + '>' + campoErr(err, 'monto') + '</label>';
  if (D.tipo === 'cuota' && deudas.length) campos += '<label class="campo"><span class="lbl">¿De qué deuda?</span><select id="d-deuda"><option value="">Sin elegir</option>' + deudas.map(d => '<option value="' + esc(d.id) + '"' + (D.deuda === d.id ? ' selected' : '') + '>' + esc(d.nombre) + ' (cuota ' + fmt(d.cuota) + ')</option>').join('') + '</select><span class="ayuda">Así Kipu sabe cuánto te falta pagar y qué parte es interés.</span></label>';
  if (t.cliente) campos += '<label class="campo"><span class="lbl">Cliente</span><input id="d-cliente" type="text" list="dl-cli" maxlength="60" autocomplete="off" placeholder="Nombre del cliente" value="' + esc(D.cliente) + '"' + attrErr(err, 'cliente') + '>' +
    '<datalist id="dl-cli">' + clientes.map(c => '<option value="' + esc(c) + '">').join('') + '</datalist>' +
    (err.cliente ? campoErr(err, 'cliente') : ayudaCli ? '<span class="ayuda">' + ayudaCli + '</span>' : '') + '</label>';
  if (D.tipo === 'cambio') campos += '<div class="campo"><span class="lbl" id="l-medio">¿Qué hiciste?</span><div class="chips" role="group" aria-labelledby="l-medio">' +
    '<button type="button" class="chip" data-dact="medio" data-v="efectivo" aria-pressed="' + (D.medio !== 'qr') + '">Saqué del cajero</button>' +
    '<button type="button" class="chip" data-dact="medio" data-v="qr" aria-pressed="' + (D.medio === 'qr') + '">Deposité en mi cuenta</button></div>' +
    '<span class="ayuda">' + (D.medio === 'qr' ? 'Pasa del efectivo a tu cuenta.' : 'Pasa de tu cuenta al efectivo.') + ' El total de tu plata no cambia.</span></div>';
  else if (t.caja) campos += '<div class="campo"><span class="lbl" id="l-medio">¿Cómo fue?</span><div class="chips" role="group" aria-labelledby="l-medio">' +
    '<button type="button" class="chip" data-dact="medio" data-v="efectivo" aria-pressed="' + (D.medio !== 'qr') + '">Efectivo</button>' +
    '<button type="button" class="chip" data-dact="medio" data-v="qr" aria-pressed="' + (D.medio === 'qr') + '">QR o banco</button></div></div>';
  if (t.cat) campos += '<div class="campo"><span class="lbl" id="l-cat">¿Qué gasto?</span><div class="chips" role="group" aria-labelledby="l-cat">' +
    CATS.map(c => '<button type="button" class="chip" data-dact="cat" data-v="' + c + '" aria-pressed="' + (D.cat === c) + '">' + c + '</button>').join('') + '</div></div>';
  if ((D.tipo === 'apartar' || D.tipo === 'soltar')) {
    campos += fondos.length ? '<label class="campo"><span class="lbl">¿Qué bolsillo?</span><select id="d-fondo"' + attrErr(err, 'fondo') + '>' + optsFondo(true) + '</select>' + campoErr(err, 'fondo') + '</label>'
      : '<p class="err">Primero crea un bolsillo en <a href="#bolsillos" data-dact="cerrar">Bolsillos</a>.</p>';
  } else if (t.fondo && fondos.length) campos += '<label class="campo"><span class="lbl">¿Lo pagas con plata de un bolsillo?</span><select id="d-fondo">' + optsFondo(false) + '</select></label>';
  if (D.tipo === 'venta') campos += '<details' + (D.costoTxt ? ' open' : '') + '><summary class="muted">Costo de lo vendido (opcional)</summary><label class="campo" style="margin-top:8px"><span class="lbl">¿Cuánto te costó lo que vendiste?</span><input id="d-costo" type="text" inputmode="decimal" autocomplete="off" placeholder="Se calcula con tu margen" value="' + esc(D.costoTxt) + '"' + attrErr(err, 'costo') + '>' + campoErr(err, 'costo') + '<span class="ayuda">Si lo dejas vacío, se calcula con el ' + explicaRep() + '.</span></label></details>';
  campos += '<div class="grid2"><label class="campo"><span class="lbl">Fecha</span><input id="d-fecha" type="date" value="' + esc(D.fecha) + '" max="' + hoyISO() + '"' + attrErr(err, 'fecha') + '>' + campoErr(err, 'fecha') + '</label>' +
    '<label class="campo"><span class="lbl">Nota</span><input id="d-nota" type="text" maxlength="140" autocomplete="off" placeholder="Opcional" value="' + esc(D.nota) + '"></label></div>';
  let nota = '';
  if (D.tipo === 'venta' && !D.id && S.perfil.modoVentas !== 'cada') nota = 'Ojo: tú cuentas la caja al cerrar. Anota aquí solo una venta especial (por ejemplo, un pedido grande); el cierre ya la descuenta para no contarla dos veces.';
  if (D.tipo === 'adelanto') nota = 'Es plata de un pedido que todavía no entregas. Queda separada hasta que anotes la entrega.';
  if (D.tipo === 'entrega') nota = 'Si al entregar te pagaron el resto, anótalo aparte como venta, o deja que lo calcule el cierre.';
  if (D.tipo === 'perdido') nota = 'Se resta de tu ganancia y el cliente deja de aparecer como deudor.';
  if (D.origen === 'cierre') nota = 'Este movimiento viene del cierre del día. Si lo cambias, el cierre deja de cuadrar. Mejor <button type="button" class="linkbtn" data-dact="ir-cierre">rehaz el cierre de ese día</button>.';
  let aviso = '';
  if (D.entendido) aviso = '<p class="entendido">' + ic('info') + '<span>Entendí: <strong>' + esc(t.label.toLowerCase()) + '</strong>. Revisa y guarda, o cambia el tipo con la flecha de arriba.</span></p>';
  if (D.tipo === 'fiado' && D.cliente.trim()) {
    const cl = clientesTodos().find(x => claveCli(x.nombre) === claveCli(D.cliente)), mt = parseMonto(D.montoTxt);
    if (cl && cl.tope > 0) { const tot = r2(cl.debe + (mt > 0 ? mt : 0)); aviso += '<p class="note ' + (tot > cl.tope ? 'out' : '') + '" id="d-tope-n">' + (tot > cl.tope ? 'Ojo: con este fiado ' + esc(cl.nombre) + ' deberá ' + fmt(tot) + ', más que su límite de ' + fmt(cl.tope) + '.' : esc(cl.nombre) + ' debe ' + fmt(cl.debe) + '. Su límite es ' + fmt(cl.tope) + '.') + '</p>'; }
  }

}
function guardarMov(){
  const t = TIPOS[D.tipo], err = {}, monto = parseMonto(D.montoTxt);
  if (!(monto > 0)) err.monto = 'Escribe un monto mayor a cero.';
  else if (monto > 10000000) err.monto = 'El monto es demasiado grande. Revisa los ceros.';
  if (t.cliente && !D.cliente.trim()) err.cliente = 'Escribe el nombre del cliente.';
  if (!isISO(D.fecha)) err.fecha = 'Elige una fecha.';
  else if (D.fecha > hoyISO()) err.fecha = 'La fecha no puede ser futura.';
  if ((D.tipo === 'apartar' || D.tipo === 'soltar') && !D.fondo) err.fondo = 'Elige el bolsillo.';
  let costo = null;
  if (D.tipo === 'venta' && String(D.costoTxt || '').trim() !== '') {
    costo = parseMonto(D.costoTxt);
    if (!(costo >= 0)) err.costo = 'Escribe un costo válido o déjalo vacío.';
    else if (monto > 0 && costo > monto * 5) err.costo = 'El costo parece muy alto. Revisa los ceros.';
  }
  if (!err.monto && !err.cliente) {
    if (D.tipo === 'cobro' || D.tipo === 'perdido') {
      const s = saldoCliente(D.cliente, D.id);
      if (monto > s + 0.004) err.monto = s > 0 ? D.cliente.trim() + ' te debe ' + fmt(s) + '. Revisa el monto.' : D.cliente.trim() + ' no tiene fiado anotado.';
    } else if (D.tipo === 'entrega') {
      const s = adelantoCliente(D.cliente, D.id);
      if (monto > s + 0.004) err.monto = s > 0 ? D.cliente.trim() + ' dejó ' + fmt(s) + ' de adelanto. Revisa el monto.' : D.cliente.trim() + ' no tiene adelantos anotados.';
    } else if (D.tipo === 'soltar' && D.fondo) {
      const s = saldoFondo(D.fondo, D.id);
      if (monto > s + 0.004) err.monto = 'Ese bolsillo tiene ' + fmt(s) + '.';
    }
  }
  if (Object.keys(err).length) { D.err = err; pintarDlg(); const f = $('[aria-invalid="true"]', dlgBody); if (f) f.focus(); return; }
  let cliente = D.cliente.trim();
  if (cliente) { const ex = nombresClientes().find(c => claveCli(c) === claveCli(cliente)); if (ex) cliente = ex; }
  const ay = S.ajustes.ayudante;
  const mov = {id:D.id || uid(), fecha:D.fecha, tipo:D.tipo, monto:r2(monto), medio:(t.caja || D.tipo === 'cambio') ? D.medio : 'efectivo', cat:t.cat ? (D.cat || 'Otros') : '',
    cliente:t.cliente ? cliente : '', nota:D.nota.trim().slice(0, 140), origen:'manual', costo:D.tipo === 'venta' ? (costo != null ? r2(costo) : null) : null,
    ayud:D.tipo === 'venta' && ay ? r2(monto * ay.pct / 100) : null, fondo:(t.fondo || D.tipo === 'apartar' || D.tipo === 'soltar') ? (D.fondo || '') : '', deuda:D.tipo === 'cuota' ? (D.deuda || '') : ''};
  if (D.id) { const i = S.movs.findIndex(m => m.id === D.id); if (i > -1) { mov.origen = S.movs[i].origen; S.movs[i] = mov; } }
  else S.movs.push(mov);
  ordenar(); guardar();
  const editado = !!D.id, id = mov.id;
  cerrarDlg(); render();
  toast((editado ? 'Corregido: ' : 'Anotado: ') + t.corto.toLowerCase() + ' de ' + fmt(mov.monto), editado ? null : {label:'Deshacer', fn:() => { S.movs = S.movs.filter(m => m.id !== id); guardar(); render(); toast('Se quitó'); }});
}

/* ---------- Bolsillo ---------- */
function abrirFondo(id, extra){
  const f = id ? fondoPorId(id) : null;
  D = f ? {kind:'fondo', id:f.id, nombre:f.nombre, metaTxt:numTxt(f.meta), frecuencia:f.frecuencia, porDiaTxt:numTxt(f.porDia), manual:true, deuda:f.deuda, err:{}}
        : Object.assign({kind:'fondo', id:null, nombre:'', metaTxt:'', frecuencia:'mensual', porDiaTxt:'', manual:false, deuda:'', err:{}}, extra || {});
  pintarDlg(); abrirDlg(); enfocar('#d-nombre');
}
function sugerenciaFondo(){
  const meta = parseMonto(D.metaTxt);
  if (!(meta > 0) || D.frecuencia === 'libre') return null;
  return Math.ceil(meta * porMes(D.frecuencia) / diasMes());
}
function pintarFondo(){
  const err = D.err || {}, sug = sugerenciaFondo();
  dlgBody.innerHTML = dlgHead(D.id ? 'Editar bolsillo' : 'Nuevo bolsillo') +
    '<form id="f-fondo" novalidate>' +
    '<label class="campo"><span class="lbl">Nombre</span><input id="d-nombre" type="text" maxlength="40" autocomplete="off" value="' + esc(D.nombre) + '"' + attrErr(err, 'nombre') + '>' + campoErr(err, 'nombre') +
    (D.id ? '' : '<div class="chips" style="margin-top:8px">' + ['Alquiler', 'Temporada baja', 'Aguinaldo', 'Impuestos', 'Mercadería de temporada'].map(n => '<button type="button" class="chip" data-dact="fondo-nombre" data-v="' + n + '">' + n + '</button>').join('') + '</div>') + '</label>' +
    '<div class="grid2"><label class="campo"><span class="lbl">¿Cuánto necesitas juntar?</span><input id="d-meta" type="text" inputmode="decimal" autocomplete="off" placeholder="0" value="' + esc(D.metaTxt) + '"><span class="ayuda">Opcional.</span></label>' +
    '<label class="campo"><span class="lbl">¿Cada cuánto lo pagas?</span><select id="d-frec">' + Object.keys(FRECUENCIAS).map(k => '<option value="' + k + '"' + (D.frecuencia === k ? ' selected' : '') + '>' + FRECUENCIAS[k] + '</option>').join('') + '<option value="libre"' + (D.frecuencia === 'libre' ? ' selected' : '') + '>Sin fecha fija</option></select></label></div>' +

function costoPrevioHTML(){
  const d = deudaDeD();
  const i = Number.isFinite(d.recibido) && Number.isFinite(d.cuota) ? tasaPeriodo(d) : null;

  const mensual = Math.pow(1 + i, porMes(d.frecuencia)) - 1;
  const tone = mensual > 0.05 ? 'malo' : mensual > 0.025 ? 'medio' : 'bueno';
  return '<div class="res ' + tone + '" style="padding:12px 14px"><p class="cap">Te cuesta</p><p style="font-weight:700;font-size:20px;margin:0">' + pctTasa(mensual) + ' al mes, ' + pctTasa(Math.pow(1 + mensual, 12) - 1) + ' al año</p>' +
    (d.soloInteres ? '' : '<p style="margin:4px 0 0">Devuelves ' + fmt(d.cuota * d.nCuotas) + ' por ' + fmt(d.recibido) + '.</p>') + '</div>';

function guardarCliente(){

  const k = claveCli(D.orig || nombre);
  const i = S.clientes.findIndex(c => claveCli(c.nombre) === k);
  const c = {id:i > -1 ? S.clientes[i].id : uid(), nombre, grupo:D.grupo.trim().slice(0, 40), telefono:tel.slice(0, 20), rapido:r2(rapido), tope:r2(tope)};

}

/* =========================================================
   Web instalable: service worker e instalación
   Solo se activa en la versión publicada con manifest (no dentro de Claude)
   ========================================================= */
const KEY_INSTALAR = 'kipu.instalar.no';
const ES_PWA = !!document.querySelector('link[rel="manifest"]') && !enClaude();
let promptInstalar = null;
const esInstalada = () => { try { return (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true; } catch (e) { return false; } };
const esIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
function instalarDescartado(){ try { return localStorage.getItem(KEY_INSTALAR) === '1'; } catch (e) { return false; } }
function instalarHTML(conBoton){
  if (!ES_PWA || esInstalada()) return '';
  if (!promptInstalar && !esIOS()) return '';
  if (!conBoton && instalarDescartado()) return '';
  const pasosIOS = 'En Safari, toca el botón Compartir y luego <strong>Agregar a inicio</strong>.';
  return '<div class="instalar">' + ic('datos') + '<div><strong>Ten Kipu como app en tu celular</strong><p>' +
    (promptInstalar ? 'Se abre con un toque desde tu pantalla de inicio y funciona sin internet.' : pasosIOS) + '</p></div>' +
    '<div class="btn-row">' + (promptInstalar ? '<button type="button" class="btn btn-pri" data-act="instalar">Instalar Kipu</button>' : '') +
    (conBoton ? '' : '<button type="button" class="btn btn-ghost" data-act="instalar-no">Ahora no</button>') + '</div></div>';
}
async function instalarApp(){
  if (!promptInstalar) { toast(esIOS() ? 'En Safari: Compartir y luego Agregar a inicio' : 'Abre el menú del navegador y elige Instalar app'); return; }
  const p = promptInstalar; promptInstalar = null;
  try { p.prompt(); const r = await p.userChoice; if (r && r.outcome === 'accepted') toast('Instalando Kipu'); } catch (e) {}
  render();
}
if (ES_PWA) {
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); promptInstalar = e; if (S.perfil) render(); });
  window.addEventListener('appinstalled', () => { promptInstalar = null; toast('Kipu quedó instalada en tu celular'); render(); });
  const seguro = location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1';
  if ('serviceWorker' in navigator && seguro) {
    window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(err => console.warn('Kipu: no se pudo activar el modo sin internet', err)); });
  }
}

/* =========================================================
   Router y eventos de la página
   ========================================================= */
const RUTAS = {inicio:vInicio, cierre:vCierre, movimientos:vMovs, flujo:vFlujo, mas:vMas, bolsillos:vBolsillos, fiado:vFiado, deudas:vDeudas,
  precio:vPrecio, lote:vLote, cuota:vCuota, mercaderia:vMerc, piloto:vPiloto, datos:vDatos, negocio:vNegocio};
function ruta(){ const h = (location.hash || '').replace(/^#/, ''); return RUTAS[h] ? h : 'inicio'; }
function render(){
  pintarBanner();
  const r = ruta();
  document.body.classList.toggle('sin-negocio', !S.perfil);
  if (!S.perfil && r !== 'datos') { main.innerHTML = vBienvenida(); marcarNav(null); return; }
  main.classList.toggle('ancho', r === 'inicio');
  try { main.innerHTML = RUTAS[r](); }
  catch (e) { console.error(e); main.innerHTML = '<div class="empty"><p>Algo falló al mostrar esta sección. Tus datos siguen guardados.</p><a class="btn" href="#inicio">Volver al inicio</a></div>'; }
  marcarNav(r);
  if (r === 'precio') actualizarPrecio();

    if (!v.nombre) errs.push('Escribe el nombre del producto para guardarlo.');
    if (v.usd && !(S.ajustes.tc > 0)) errs.push('Primero anota el dólar de hoy, arriba.');
    else if (v.usd && !(v.costoUsd > 0)) errs.push('Escribe el costo en dólares.');
    else if (!(v.costoNuevo > 0)) errs.push('Escribe cuánto te cuesta reponerlo.');
    if (!(v.precio > 0)) errs.push('Escribe a cuánto lo vendes.');
    if (errs.length) { $('#p-err').innerHTML = errsHTML(errs); return; }
    const id = f.elements.id.value;
    const p = {id:id || uid(), nombre:v.nombre, costoAnt:Number.isFinite(v.costoAnt) ? v.costoAnt : 0, costoNuevo:v.costoNuevo, precio:v.precio, markup:v.markup, costoUsd:v.costoUsd};
    const i = S.productos.findIndex(x => x.id === id);
    if (i > -1) S.productos[i] = p; else S.productos.push(p);
    guardar(); render(); toast('Producto guardado');
  } else if (f.id === 'f-lote') {
    const l = leerLote(f), errs = [];
    if (!l.nombre) errs.push('Escribe qué compraste.');
    if (!(l.costo > 0)) errs.push('Escribe cuánto pagaste.');
    if (!(l.unidades > 0)) errs.push('Escribe cuántas unidades vienen.');
    if (!(l.precio > 0)) errs.push('Escribe a cuánto vendes cada unidad.');
    if (errs.length) { $('#l-err').innerHTML = errsHTML(errs); return; }
    S.lotes.push({id:uid(), nombre:l.nombre, costo:r2(l.costo), unidades:l.unidades, precio:r2(l.precio), vendidas:0, fecha:hoyISO()});
    guardar(); render(); toast('Lote guardado');
  } else if (f.id === 'f-merc') {
    const valor = parseMonto(g('valor')), fecha = g('fecha');
    if (!(valor >= 0) || g('valor').trim() === '') { $('#m-err').innerHTML = errsHTML(['Escribe el valor de tu mercadería.']); return; }
    if (!isISO(fecha) || fecha > hoyISO()) { $('#m-err').innerHTML = errsHTML(['Elige una fecha de hoy o anterior.']); return; }
    const ex = S.conteos.find(c => c.fecha === fecha);
    if (ex) ex.valor = r2(valor); else S.conteos.push({id:uid(), fecha, valor:r2(valor)});
    ordenar(); guardar(); render(); toast('Conteo guardado');
  } else if (f.id === 'f-negocio') {
    const nombre = g('nombre').trim(), ef = montoCampo(g, 'efectivo'), cu = montoCampo(g, 'cuenta'), sueldo = montoCampo(g, 'sueldo'), fecha = g('fecha');
    const conAy = f.elements.conAyud.checked, ayN = g('ayNombre').trim(), ayP = parseMonto(g('ayPct'));
    const errs = [];
    if (!nombre) errs.push('Escribe el nombre del negocio.');
    const cn = leerCamposNegocio(f, errs);
    if (!Number.isFinite(ef)) errs.push('Revisa el efectivo inicial.');
    if (!Number.isFinite(cu)) errs.push('Revisa la plata inicial de la cuenta.');
    if (!Number.isFinite(sueldo) || sueldo < 0) errs.push('Revisa el tope semanal.');
    if (!isISO(fecha) || fecha > hoyISO()) errs.push('Elige la fecha de inicio.');
    if (conAy && !ayN) errs.push('Escribe el nombre de tu ayudante.');
    if (conAy && !(ayP > 0 && ayP <= 100)) errs.push('El porcentaje del ayudante debe estar entre 0 y 100.');
    if (errs.length) { $('#n-err').innerHTML = errsHTML(errs); return; }
    Object.assign(S.perfil, {nombre, rubro:g('rubro').trim(), efectivoInicial:r2(ef), cuentaInicial:r2(cu), sueldoSemanal:r2(sueldo), fechaInicio:fecha, diasSemana:+g('dias') || 6}, cn);
    S.ajustes.ayudante = conAy ? {nombre:ayN.slice(0, 40), pct:r2(ayP)} : null;
    guardar(); render(); toast('Cambios guardados');
  }
});

// Pide al navegador no borrar los datos cuando falta espacio (no todos lo permiten)
function pedirPersistencia(){ try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) {} }
const datos = cargar();
if (datos) { S = datos; if (S.perfil && !S.demo) pedirPersistencia(); }
construirCabecera();
aplicarTema(leerTema());
render();
if (window.claude && typeof window.claude.use === 'function') {
  DLp = window.claude.use('downloads').catch(() => null);
}

})();
