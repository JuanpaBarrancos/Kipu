<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kipu, las cuentas de tu negocio</title>
<meta name="description" content="Kipu ayuda a pequeños negocios a cerrar la caja en 2 minutos, separar la plata para reponer mercadería, controlar el fiado y ver cuánto cuestan sus deudas. Sin cuenta y sin NIT.">
<meta name="theme-color" content="#7B1E4E" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171D36" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kipu">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/atkinson-hyperlegible-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Atkinson Hyperlegible";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/atkinson-hyperlegible-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Atkinson Hyperlegible";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/atkinson-hyperlegible-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Bricolage Grotesque";font-style:normal;font-weight:200 800;font-display:swap;src:url(fonts/bricolage-grotesque-latin-opsz-normal.woff2) format("woff2-variations"),url(fonts/bricolage-grotesque-latin-opsz-normal.woff2) format("woff2")}
/* ---------- Tokens ---------- */
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
  --paper:#F2F4F9; --surface:#FFFFFF; --sunk:#E7EBF3; --ink:#16203B; --ink-2:#4A5574; --line:#D3D9E6;
  --in:#1A5DAD; --in-soft:#E1EBF8; --out:#B34E19; --out-soft:#FAE6DA;
  --brand:#7B1E4E; --brand-soft:#F3E2EB; --on-brand:#FFFFFF;
  --warn:#7A5300; --warn-soft:#FFF0CC;
  --f-ui:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  --f-display:"Bricolage Grotesque","Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --r-s:10px; --r-m:14px; --r-l:20px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#0E1326; --surface:#171D36; --sunk:#222A48; --ink:#ECEFF7; --ink-2:#A9B2CC; --line:#2D365A;
    --in:#86B6F2; --in-soft:#18304F; --out:#F29A63; --out-soft:#3E2416;
    --brand:#E792BE; --brand-soft:#3A1A2D; --on-brand:#1C0E16;
    --warn:#F2C96C; --warn-soft:#382D10;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#0E1326; --surface:#171D36; --sunk:#222A48; --ink:#ECEFF7; --ink-2:#A9B2CC; --line:#2D365A;
  --in:#86B6F2; --in-soft:#18304F; --out:#F29A63; --out-soft:#3E2416;
  --brand:#E792BE; --brand-soft:#3A1A2D; --on-brand:#1C0E16;
  --warn:#F2C96C; --warn-soft:#382D10;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:17px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;margin:0}
h1{font-size:clamp(28px,7vw,36px);font-weight:750;letter-spacing:-0.02em;margin:4px 0 10px}
h2{font-size:21px;font-weight:700;margin:30px 0 10px}
h3{font-size:18px;font-weight:700;margin:0 0 10px}
p{margin:0 0 10px}
a{color:var(--in)}
.ic{width:22px;height:22px;flex:none}
:focus-visible{outline:3px solid var(--in);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.in{color:var(--in)} .out{color:var(--out)} .muted{color:var(--ink-2)}
.num{font-variant-numeric:tabular-nums}

/* ---------- Estructura ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.band{height:8px;background:linear-gradient(180deg,#7B1E4E 0 2px,#C2571F 2px 4px,#E3B341 4px 6px,#1A5DAD 6px 8px)}
.top-in{display:flex;align-items:center;gap:12px;max-width:1180px;margin:0 auto;padding:8px 14px}
.brand{display:flex;align-items:center;gap:6px;color:var(--ink);text-decoration:none;font-family:var(--f-display);font-weight:800;font-size:23px;letter-spacing:-0.02em}
.brand .ic{color:var(--brand);width:26px;height:26px}
.biz{flex:1;min-width:0;color:var(--ink-2);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{display:grid;place-items:center;width:44px;height:44px;border-radius:12px;border:0;background:transparent;color:var(--ink);cursor:pointer}
.icon-btn:hover{background:var(--sunk)}
.shell{display:block}
main{max-width:760px;margin:0 auto;padding:18px 16px calc(112px + env(safe-area-inset-bottom,0px));outline:none}
#banner:empty{display:none}
.banner{max-width:760px;margin:12px auto 0;padding:12px 16px;border-radius:var(--r-m);background:var(--brand-soft);display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap;font-size:15.5px}
.banner.err{background:var(--out-soft)}
.banner p{margin:0;flex:1 1 240px}

/* Navegación */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.nav a,.nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:54px;color:var(--ink-2);text-decoration:none;font:700 12px/1.2 var(--f-ui);background:none;border:0;border-radius:12px;cursor:pointer;padding:4px 1px;white-space:nowrap;min-width:0}
.only-d{display:none}
.nav [aria-current="page"]{color:var(--brand)}
.nav .add-dot{width:48px;height:48px;border-radius:50%;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;margin-top:-20px;box-shadow:0 6px 16px rgba(123,30,78,.32)}
.nav .nav-extra,.nav .nav-sep{display:none}
@media (min-width:960px){
  .shell{display:grid;grid-template-columns:236px minmax(0,1fr)}
  .nav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 69px);align-self:start;display:flex;flex-direction:column;gap:2px;border:0;border-right:1px solid var(--line);background:transparent;padding:18px 12px;max-height:calc(100vh - 69px);overflow:auto}
  .nav a,.nav button{flex-direction:row;justify-content:flex-start;gap:12px;padding:10px 12px;font-size:16px;min-height:46px}
  .nav a:hover{background:var(--sunk)}
  .nav [aria-current="page"]{background:var(--brand-soft)}
  .nav .nav-add{order:-1;margin-bottom:12px;background:var(--brand);color:var(--on-brand);border-radius:999px;justify-content:center}
  .nav .add-dot{margin:0;width:auto;height:auto;background:none;box-shadow:none;color:inherit}
  .nav-extra{display:flex !important}
  .nav .nav-sep{display:block;height:1px;background:var(--line);margin:10px 12px}
  .nav-mas{display:none !important}
  .only-d{display:inline}.only-m{display:none}
  main{padding-bottom:56px}
}

/* ---------- Componentes ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 18px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:700 16px/1.2 var(--f-ui);cursor:pointer;text-decoration:none;text-align:center}
.btn:hover{border-color:var(--ink-2)}
.btn-pri{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn-pri:hover{border-color:var(--brand);filter:brightness(1.08)}
.btn-in{background:var(--in-soft);border-color:transparent;color:var(--in)}
.btn-out{background:var(--out-soft);border-color:transparent;color:var(--out)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn-danger{background:transparent;border-color:var(--out);color:var(--out)}
.btn.armed{background:var(--out);border-color:var(--out);color:#fff}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn-row{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}
.lead{font-size:18.5px;color:var(--ink-2);margin:0 0 4px}
.seg{display:inline-flex;background:var(--sunk);border-radius:999px;padding:4px;gap:2px}
.seg button{border:0;background:transparent;padding:8px 16px;min-height:40px;border-radius:999px;font:700 15px var(--f-ui);color:var(--ink-2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(10,20,50,.12)}
.mesnav{display:flex;align-items:center;gap:6px;margin:12px 0 14px}
.mesnav strong{font-family:var(--f-display);font-size:20px;min-width:180px;text-align:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:18px}
.empty{padding:28px 18px;text-align:center;border:1.5px dashed var(--line);border-radius:var(--r-l)}
.empty p{color:var(--ink-2)}
.note{font-size:15px;color:var(--ink-2)}

/* Inicio */
.hero{margin:6px 0 22px}
.hero .big{font-family:var(--f-display);font-weight:800;font-size:clamp(34px,9vw,54px);line-height:1.04;letter-spacing:-0.025em;margin:4px 0 0}
.capital .sub{color:var(--ink-2);margin:-4px 0 10px}
.cord-row{display:grid;grid-template-columns:76px 1fr;align-items:center;gap:12px;margin:8px 0}
.cord-row>span{font-size:15px;color:var(--ink-2)}
.cord{display:flex;height:14px;border-radius:999px;overflow:hidden;background:var(--sunk)}
.cord.now{height:28px}
.cord>span{height:100%}
.cord>span+span{border-left:3px solid var(--surface)}
.s-caja{background:var(--ink)} .s-merc{background:var(--brand)}
.s-cobrar{background:repeating-linear-gradient(135deg,var(--brand) 0 3px,var(--brand-soft) 3px 7px)}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:15px;color:var(--ink-2);margin-top:8px}
.legend b{color:var(--ink);font-variant-numeric:tabular-nums}
.sw{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:6px}
.alertas{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.al{display:grid;grid-template-columns:26px 1fr;gap:10px;padding:14px 16px;border-radius:var(--r-m);background:var(--sunk)}
.al .ic{color:var(--ink-2);margin-top:1px}
.al.alerta{background:var(--out-soft)} .al.alerta .ic{color:var(--out)}
.al.aviso{background:var(--warn-soft)} .al.aviso .ic{color:var(--warn)}
.al strong{display:block}
.al p{margin:2px 0 4px;color:var(--ink-2);font-size:15.5px}
.al a{color:var(--ink);font-weight:700}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quick .btn{justify-content:flex-start;border-radius:var(--r-m);min-height:62px;padding:12px 14px;font-size:16.5px;text-align:left}
@media (min-width:620px){.quick{grid-template-columns:repeat(4,1fr)}}

/* Listas de movimientos */
.lista{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);overflow:hidden}
.lista li+li{border-top:1px solid var(--line)}
.mov{width:100%;display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 14px;background:none;border:0;text-align:left;color:var(--ink);font:inherit;cursor:pointer;min-height:62px}
.mov:hover{background:var(--sunk)}
.mov-ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center}
.mov-ic.in{background:var(--in-soft);color:var(--in)} .mov-ic.out{background:var(--out-soft);color:var(--out)} .mov-ic.neu{background:var(--sunk);color:var(--ink-2)}
.mov-n{display:block;font-weight:700}
.mov-d{display:block;font-size:14.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mov-m{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.dia-h{display:flex;justify-content:space-between;gap:10px;font-size:15px;color:var(--ink-2);margin:18px 4px 6px}

/* Tablas */
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tabla{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;background:var(--surface)}
.tabla th,.tabla td{padding:10px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
.tabla th{font-size:14.5px;color:var(--ink-2);font-weight:700}
.tabla .n{text-align:right;white-space:nowrap}
.tabla tr.sub td:first-child{padding-left:26px;color:var(--ink-2)}
.tabla tr.grp td{font-weight:700;padding-top:14px}
.tabla tr.tot td{font-weight:700;background:var(--sunk)}
.tabla tr.fut td{color:var(--ink-2)}
.tbox{border:1px solid var(--line);border-radius:var(--r-l);overflow:hidden}

/* Formularios */
.campo{display:block;margin:0 0 16px}
.campo .lbl{display:block;font-weight:700;margin-bottom:6px}
.campo .ayuda{display:block;font-size:14.5px;color:var(--ink-2);margin-top:5px}
input[type=text],input[type=date],input[type=search],select,textarea{width:100%;min-height:50px;padding:10px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font:inherit}
textarea{min-height:110px;font-size:15px}
input:focus,select:focus,textarea:focus{border-color:var(--in);outline:none;box-shadow:0 0 0 3px var(--in-soft)}
input.monto{font-family:var(--f-display);font-size:32px;font-weight:700;min-height:66px;letter-spacing:-0.01em}
input[aria-invalid="true"]{border-color:var(--out)}
.err{display:block;color:var(--out);font-weight:700;font-size:15px;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:8px 15px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:700 15px var(--f-ui);cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--surface)}
.check{display:flex;gap:10px;align-items:flex-start;margin:0 0 16px;cursor:pointer}
.check input{width:22px;height:22px;margin-top:2px;accent-color:var(--brand)}
.grid2{display:grid;gap:0 14px}
@media (min-width:560px){.grid2{grid-template-columns:1fr 1fr}}
.dos{display:grid;gap:22px}
@media (min-width:760px){.dos{grid-template-columns:1fr 1fr;align-items:start}}

/* Resultados de calculadoras */
.res{border-radius:var(--r-l);padding:18px;background:var(--sunk)}
.res .cap{font-size:15px;color:var(--ink-2);margin:0}
.res .big{font-family:var(--f-display);font-size:clamp(30px,7vw,40px);font-weight:800;line-height:1.08;letter-spacing:-0.02em;margin:2px 0 8px}
.res.malo{background:var(--out-soft)} .res.medio{background:var(--warn-soft)} .res.bueno{background:var(--in-soft)}
.res p{font-size:16px}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 16px;margin:10px 0 0}
.kv dt{color:var(--ink-2)} .kv dd{margin:0;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.kv .tot{border-top:1.5px solid currentColor;padding-top:6px}
.estado{display:inline-block;font-size:13.5px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
.estado.malo{background:var(--out-soft);color:var(--out)} .estado.medio{background:var(--warn-soft);color:var(--warn)} .estado.bueno{background:var(--in-soft);color:var(--in)}

/* Menú Más */
.menu{list-style:none;margin:0;padding:0}
.menu a{display:grid;grid-template-columns:46px 1fr 20px;gap:14px;align-items:center;padding:14px 4px;color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line)}
.menu .mi{width:46px;height:46px;border-radius:13px;background:var(--brand-soft);display:grid;place-items:center;color:var(--brand)}
.menu strong{display:block;font-size:17.5px}
.menu .d{color:var(--ink-2);font-size:15px}

/* Fiado */
.clientes{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.cli{border:1px solid var(--line);border-radius:var(--r-l);padding:16px;background:var(--surface)}
.cli-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.cli-h strong{font-size:18px}
.cli-m{font-family:var(--f-display);font-size:26px;font-weight:800;color:var(--out)}
.cli details{margin-top:8px}
.cli summary{cursor:pointer;color:var(--ink-2);font-size:15px;min-height:32px}
.mini{list-style:none;margin:6px 0 0;padding:0;font-size:15px}
.mini li{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px solid var(--line)}

/* Gráficos */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--ink-2);font:12px var(--f-ui)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .zero{stroke:var(--ink-2);stroke-width:1.2;stroke-dasharray:4 4}
.chart .b-in{fill:var(--in)} .chart .b-out{fill:var(--out)}
.chart .l-saldo{stroke:var(--ink);fill:none;stroke-width:2.5}
.chart .d-saldo{fill:var(--surface);stroke:var(--ink);stroke-width:2}
.chart .area{fill:var(--in-soft)} .chart .l-caja{stroke:var(--in);fill:none;stroke-width:2.5}
.chartbox{border:1px solid var(--line);border-radius:var(--r-l);background:var(--surface);padding:12px 10px 6px}

/* Diálogo */
dialog#dlg{border:0;padding:0;width:min(560px,100vw);max-width:100vw;max-height:94vh;border-radius:22px 22px 0 0;margin:auto auto 0;background:var(--surface);color:var(--ink)}
@media (min-width:620px){dialog#dlg{margin:auto;border-radius:22px}}
dialog#dlg[open]{display:block}
dialog::backdrop{background:rgba(8,12,28,.55)}
.dlg-in{padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px));overflow:auto;max-height:94vh}
.dlg-head{display:flex;align-items:center;gap:6px;margin-bottom:14px}
.dlg-head h2{margin:0;flex:1;font-size:22px}
.tipos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tipo{display:flex;align-items:center;gap:10px;min-height:66px;padding:12px;border-radius:var(--r-m);border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:700 16px/1.25 var(--f-ui);text-align:left;cursor:pointer}
.tipo:hover{border-color:var(--ink-2)}
.tipo.in .ic{color:var(--in)} .tipo.out .ic{color:var(--out)} .tipo.neu .ic{color:var(--ink-2)}
.tipos-sep{grid-column:1/-1;font-size:14.5px;color:var(--ink-2);margin:6px 2px 0}
.dlg-acc{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.dlg-acc .btn-pri{flex:1 1 200px}

/* Bienvenida */
.welcome{padding-top:10px}
.welcome .q{font-family:var(--f-display);font-size:clamp(38px,10.5vw,64px);line-height:1;letter-spacing:-0.035em;font-weight:800;margin:10px 0 16px}
.welcome .lead{max-width:34em}

/* Toast */
.toast{position:fixed;left:50%;bottom:calc(98px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:var(--ink);color:var(--surface);padding:12px 20px;border-radius:999px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;max-width:calc(100vw - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (min-width:960px){.toast{bottom:32px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none !important;animation:none !important}}

/* ---------- Versión 2 ---------- */
.cap-h{font-size:15.5px;font-weight:700;color:var(--ink-2);margin:0;text-transform:uppercase;letter-spacing:.06em}
.hero .lead strong{color:var(--ink)}
.barra{margin-top:12px}
.s-rep{background:var(--ink)}
.s-fondo{background:var(--brand)}
.s-adel{background:repeating-linear-gradient(135deg,var(--warn) 0 3px,var(--warn-soft) 3px 7px)}
.s-libre{background:var(--in)}
.s-falta{background:repeating-linear-gradient(45deg,var(--out) 0 3px,var(--out-soft) 3px 7px)}

// Montos en bolivianos con formato local: Bs 1.234,50
function fmt(n){
  const v = r2(Math.abs(n));
  const partes = v.toFixed(2).split('.');
  const ent = partes[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  const s = partes[1] === '00' ? ent : ent + ',' + partes[1];

}
function fmtCorto(n){
  const a = Math.abs(n), s = n < 0 ? '−' : '';

  return s + Math.round(a);
}
const pct = x => (Math.round(x * 10) / 10).toString().replace('.', ',') + '%';

// Lee montos escritos de muchas formas: 1.234,50 / 1234.5 / 1,234.50 / (120) / -45
function parseMonto(raw){
  if (typeof raw === 'number') return raw;
  let s = String(raw == null ? '' : raw).trim().replace(/bs\.?|\$|usd|\s/gi, '');
  if (!s) return NaN;
  let neg = false;
  if (/^\(.*\)$/.test(s)) { neg = true; s = s.slice(1, -1); }
  if (/^[-−]/.test(s)) { neg = true; s = s.slice(1); }
  if (/[-−]$/.test(s)) { neg = true; s = s.slice(0, -1); }
  const lc = s.lastIndexOf(','), ld = s.lastIndexOf('.');
  if (lc > -1 && ld > -1) {
    s = lc > ld ? s.replace(/\./g, '').replace(',', '.') : s.replace(/,/g, '');
  } else if (lc > -1) {
    const dec = s.length - lc - 1, cnt = (s.match(/,/g) || []).length;
    s = (cnt === 1 && dec !== 3) ? s.replace(',', '.') : s.replace(/,/g, '');

    const cnt = (s.match(/\./g) || []).length, dec = s.length - ld - 1;

  const n = parseFloat(s);

// Lee fechas: 25/10/2026, 25-10-26, 2026-10-25 (con o sin hora)
function parseFecha(v){
  if (v == null) return null;

  if (i == null) return null;
  const mensual = Math.pow(1 + i, porMes(d.frecuencia)) - 1;
  const anual = Math.pow(1 + mensual, 12) - 1;
  const pagos = S.movs.filter(m => m.tipo === 'cuota' && m.deuda === d.id);
  const pagado = r2(pagos.reduce((t, m) => t + m.monto, 0));
  const total = d.soloInteres ? null : r2(d.cuota * d.nCuotas);
  const restantes = d.soloInteres ? null : Math.max(0, d.nCuotas - pagos.length);
  return {periodo:i, mensual, anual, pagado, nPagos:pagos.length, total, interes:total != null ? r2(total - d.recibido) : null,
    restantes, pendiente:restantes != null ? r2(restantes * d.cuota) : null, porDia:Math.ceil(d.cuota * porMes(d.frecuencia) / diasMes() - 0.001)};
}
// Parte de una cuota que es interés (estimado con capital en partes iguales)
function interesDeCuota(m){
  const d = m.deuda ? deudaPorId(m.deuda) : null;
  if (!d) return 0;
  if (d.soloInteres) return m.monto;
  if (!(d.nCuotas > 0)) return 0;
  return Math.max(0, m.monto - d.recibido / d.nCuotas);
}
const fondoPorDia = f => f.porDia > 0 ? f.porDia : 0;

function resumen(a, b){
  const ms = movsEntre(a, b);
  const r = {n:ms.length, ventaEf:0, ventaQr:0, gastosCat:{}, interes:0};
  for (const k in TIPOS) r[k] = 0;
  for (const m of ms) {
    r[m.tipo] += m.monto;
    if (m.tipo === 'venta') { if (m.medio === 'qr') r.ventaQr += m.monto; else r.ventaEf += m.monto; }
    if (m.tipo === 'gasto') { const c = m.cat || 'Otros'; r.gastosCat[c] = (r.gastosCat[c] || 0) + m.monto; }
    if (m.tipo === 'cuota') r.interes += interesDeCuota(m);
  }
  for (const k in TIPOS) r[k] = r2(r[k]);
  r.ventaEf = r2(r.ventaEf); r.ventaQr = r2(r.ventaQr); r.interes = r2(r.interes);
  r.entro = r2(r.venta + r.cobro + r.adelanto + r.prestamo + r.aporte);
  r.salio = r2(r.compra + r.gasto + r.retiro + r.cuota);
  r.quedo = r2(r.entro - r.salio);
  r.ventas = r2(r.venta + r.fiado + r.entrega);
  r.operativo = r2(r.venta + r.cobro - r.compra - r.gasto);
  r.libre = r2(r.operativo - r.retiro);
  // Cambio de mercadería: solo si hay un conteo dentro del periodo y otro antes
  let ini = mercaderiaEn(addDays(a, -1));
  if (!ini && S.perfil) ini = S.conteos.find(c => c.fecha === S.perfil.fechaInicio && c.fecha >= a && c.fecha <= b) || null;
  const fin = mercaderiaEn(b);
  r.conteoOk = !!(ini && fin && fin !== ini && fin.fecha >= a);
  // Sin conteo en el periodo, el cambio de mercadería se estima: lo comprado menos el costo de lo vendido
  let costoVentas = 0;
  if (!r.conteoOk) { const cp = costoPct(); for (const m of ms) { if (m.tipo === 'venta') costoVentas += m.costo != null ? m.costo : m.monto * cp; else if (m.tipo === 'fiado' || m.tipo === 'entrega') costoVentas += m.monto * cp; } }
  r.deltaMerc = r.conteoOk ? r2(fin.valor - ini.valor) : r2(r.compra - costoVentas);
  r.ganancia = r2(r.ventas - r.compra - r.gasto - r.perdido - r.interes + r.deltaMerc);
  return r;
}

/* Clientes: fiado, pedidos con adelanto y datos de contacto */
function clientesTodos(){
  const map = new Map();
  const get = nombre => {
    const k = claveCli(nombre);
    if (!map.has(k)) map.set(k, {nombre:String(nombre).trim(), debe:0, desde:'', adelanto:0, movs:[], grupo:'', telefono:'', rapido:0, tope:0, id:null});
    return map.get(k);
  };
  for (const c of S.clientes) Object.assign(get(c.nombre), {id:c.id, grupo:c.grupo, telefono:c.telefono, rapido:c.rapido, tope:c.tope || 0, nombre:c.nombre});
  for (const m of S.movs) {
    if (!TIPOS[m.tipo].cliente) continue;
    const c = get(m.cliente || 'Sin nombre');
    if (m.tipo === 'fiado') { if (c.debe <= 0.004) c.desde = m.fecha; c.debe += m.monto; }
    else if (m.tipo === 'cobro' || m.tipo === 'perdido') { c.debe -= m.monto; if (c.debe <= 0.004) c.desde = ''; }
    else if (m.tipo === 'adelanto') c.adelanto += m.monto;
    else if (m.tipo === 'entrega') c.adelanto = Math.max(0, c.adelanto - m.monto);
    c.movs.push(m);
  }
  return Array.from(map.values()).map(c => Object.assign(c, {debe:r2(Math.max(0, c.debe)), adelanto:r2(c.adelanto)})).sort((a, b) => b.debe - a.debe || a.nombre.localeCompare(b.nombre, 'es'));
}
function saldoCliente(nombre, excluirId){
  const k = claveCli(nombre); let t = 0;
  for (const m of S.movs) {
    if (m.id === excluirId || claveCli(m.cliente) !== k) continue;
    if (m.tipo === 'fiado') t += m.monto; else if (m.tipo === 'cobro' || m.tipo === 'perdido') t -= m.monto;
  }
  return r2(t);
}
function adelantoCliente(nombre, excluirId){
  const k = claveCli(nombre); let t = 0;
  for (const m of S.movs) {
    if (m.id === excluirId || claveCli(m.cliente) !== k) continue;
    if (m.tipo === 'adelanto') t += m.monto; else if (m.tipo === 'entrega') t = Math.max(0, t - m.monto);
  }
  return r2(t);
}
function nombresClientes(){
  const set = new Map();
  for (const c of S.clientes) set.set(claveCli(c.nombre), c.nombre);
  for (const m of S.movs) if (m.cliente) set.set(claveCli(m.cliente), m.cliente.trim());

}

// Promedio de los últimos meses completos con datos
function promedioMeses(n){
  const hoy = hoyISO(); let k = sumarMes(mesKey(hoy), -1); const res = [];
  for (let i = 0; i < 12 && res.length < n; i++, k = sumarMes(k, -1)) {
    if (S.perfil && finMes(k) < S.perfil.fechaInicio) break;
    const r = resumen(inicioMes(k), finMes(k)); if (r.n) res.push(r);
  }
  if (!res.length) return null;
  const avg = f => r2(res.reduce((t, r) => t + r[f], 0) / res.length);
  return {meses:res.length, libre:avg('libre'), cuota:avg('cuota'), ventas:avg('ventas')};
}
function ventasDiariasProm(){
  const hoy = hoyISO(), a = addDays(hoy, -29); const r = resumen(a, hoy);
  const dias = Math.max(1, Math.min(30, diasEntre(S.perfil ? (S.perfil.fechaInicio > a ? S.perfil.fechaInicio : a) : a, hoy) + 1));
  return r.ventas / dias;
}

/* Precio de reposición y dólar del día */
const costoProducto = p => p.costoUsd > 0 && S.ajustes.tc > 0 ? r2(p.costoUsd * S.ajustes.tc) : p.costoNuevo;
function calcPrecio(v){
  if (!(v.costoNuevo > 0)) return null;
  const sugerido = Math.ceil(v.costoNuevo * (1 + v.markup / 100) * 2 - 1e-9) / 2;
  const res = {sugerido};
  if (v.precio > 0) {
    res.real = r2(v.precio - v.costoNuevo);
    res.realPct = res.real / v.costoNuevo * 100;
    if (v.costoAnt > 0) res.aparente = r2(v.precio - v.costoAnt);
    res.estado = v.precio < v.costoNuevo - 0.001 ? 'malo' : v.precio < sugerido - 0.001 ? 'medio' : 'bueno';
  }
  return res;
}
const productosBajoCosto = () => S.productos.filter(p => { const c = costoProducto(p); return p.precio > 0 && c > 0 && p.precio < c - 0.001; });
function cuotaFrancesa(P, tasaAnual, n){
  if (!(P > 0) || !(n > 0)) return null;
  const i = tasaAnual / 100 / 12;
  return i === 0 ? P / n : P * i / (1 - Math.pow(1 + i, -n));
}

/* Recuperar un lote: cuántas unidades vender para volver a tener la plata */
function calcLote(l){
  if (!(l.costo > 0) || !(l.unidades > 0)) return null;
  const minimo = l.costo / l.unidades;
  const r = {minimo};
  if (l.precio > 0) {
    r.recuperaEn = Math.ceil(l.costo / l.precio - 1e-9);
    r.recuperado = r2(Math.min(l.vendidas, l.unidades) * l.precio);
    r.falta = r2(Math.max(0, l.costo - r.recuperado));
    r.progreso = Math.min(1, r.recuperado / l.costo);
    r.gananciaTotal = r2(l.unidades * l.precio - l.costo);
    r.alcanza = r.recuperaEn <= l.unidades;
  }
  return r;
}

/* Cierre del día: deduce las ventas a partir del conteo de la caja y del total por QR */
function calcCierre(fecha, efectivo, qr, personal, apertura){
  const aperturaCalc = saldos(addDays(fecha, -1)).efectivo;
  const ap = Number.isFinite(apertura) ? apertura : aperturaCalc;
  const ms = S.movs.filter(m => m.fecha === fecha && m.origen !== 'cierre');
  const tot = {}; for (const k in TIPOS) tot[k] = 0;
  let netEf = 0, qrIn = 0, ventaQrMan = 0;
  for (const m of ms) {
    const t = TIPOS[m.tipo];
    tot[m.tipo] += m.monto;
    if (m.tipo === 'cambio') netEf += m.medio === 'efectivo' ? m.monto : -m.monto;
    else if (t.caja && m.medio !== 'qr') netEf += t.signo * m.monto;
    if (t.caja && m.medio === 'qr' && (m.tipo === 'venta' || m.tipo === 'cobro' || m.tipo === 'adelanto')) qrIn += m.monto;
    if (m.tipo === 'venta' && m.medio === 'qr') ventaQrMan += m.monto;
  }
  const esperado = r2(ap + netEf);
  const r = {fecha, aperturaCalc, apertura:ap, esperado, netEf:r2(netEf), tot, qrIn:r2(qrIn), movsDia:ms.length};
  if (Number.isFinite(efectivo)) {
    const dif = r2(efectivo - esperado);
    r.ventasEf = Math.max(0, dif); r.faltante = Math.max(0, -dif);
  }
  if (Number.isFinite(qr)) {
    const p = Number.isFinite(personal) ? personal : 0;
    const dq = r2(qr - p - qrIn);
    r.ventasQr = Math.max(0, dq); r.qrExceso = Math.max(0, -dq);
  }
  r.ventasMan = r2(tot.venta);
  r.ventasDia = r2((r.ventasEf || 0) + (r.ventasQr || 0) + tot.venta);
  r.costoDia = r2(((r.ventasEf || 0) + (r.ventasQr || 0)) * costoPct() + ms.filter(m => m.tipo === 'venta').reduce((t, m) => t + costoDe(m), 0) + (tot.cobro + tot.entrega) * costoPct());
  return r;
}

/* Indicadores del piloto: cifras agregadas, sin datos personales ni fiscales */
function indicadores(dias){
  const hoy = hoyISO();
  let desde = addDays(hoy, -(dias - 1)); if (S.perfil && desde < S.perfil.fechaInicio) desde = S.perfil.fechaInicio;
  const n = diasEntre(desde, hoy) + 1;
  const r = resumen(desde, hoy);
  const fechas = new Set(movsEntre(desde, hoy).map(m => m.fecha));
  const cierres = S.cierres.filter(c => c.fecha >= desde && c.fecha <= hoy).length;
  const abiertos = Math.max(1, Math.round(n * (S.perfil ? S.perfil.diasSemana : 6) / 7));
  let cubiertos = 0;
  for (let i = 0; i < n; i++) if (bolsillos(addDays(desde, i)).libre >= -0.5) cubiertos++;
  const c0 = capitalEn(desde === (S.perfil && S.perfil.fechaInicio) ? desde : addDays(desde, -1)), c1 = capitalEn(hoy);
  let semanas = 0, semOk = 0;
  const tope = S.perfil ? S.perfil.sueldoSemanal : 0;
  if (tope > 0) for (let d = inicioSemana(desde); d <= hoy; d = addDays(d, 7)) {
    const a = d < desde ? desde : d, bb = addDays(d, 6) > hoy ? hoy : addDays(d, 6);
    semanas++; if (resumen(a, bb).retiro <= tope + 0.004) semOk++;
  }
  const caras = S.deudas.filter(d => d.activa).filter(d => { const c = costoDeuda(d); return c && c.mensual > 0.05; }).length;
  return {desde, hasta:hoy, dias:n, diasAnotados:fechas.size, cierres, abiertos, cubiertos,
    ventas:r.ventas, ventasDia:r2(r.ventas / Math.max(1, fechas.size)), ganancia:r.ganancia, retiro:r.retiro,
    capital0:c0.total, capital1:c1.total, semanas, semOk, tope,
    fiado:r.fiado, cobro:r.cobro, perdido:r.perdido, caras, deudas:S.deudas.filter(d => d.activa).length,
    libre:bolsillos(hoy).libre, racha:racha(), opinion:S.ajustes.opinion || null, recomendaciones:S.ajustes.recomendaciones || 0};
}

/* QR pendiente: días cerrados sin el total por QR, para cuadrarlos juntos */
const qrPendientes = () => S.cierres.filter(c => c.qrPend);
function calcQrPend(total, personal){
  const pend = qrPendientes(); if (!pend.length) return null;
  const desde = pend[0].fecha, hasta = pend[pend.length - 1].fecha;
  let qrIn = 0;
  for (const m of S.movs) if (m.fecha >= desde && m.fecha <= hasta && m.medio === 'qr' && ['venta', 'cobro', 'adelanto', 'aporte'].indexOf(m.tipo) > -1) qrIn += m.monto;
  const r = {desde, hasta, dias:pend.length, qrIn:r2(qrIn)};
  if (Number.isFinite(total)) { const d = r2(total - (personal > 0 ? personal : 0) - qrIn); r.ventas = Math.max(0, d); r.exceso = Math.max(0, -d); }
  return r;
}
/* Margen real: con dos conteos de mercadería separados por 3 semanas o más */
function margenReal(){
  if (!S.perfil || S.perfil.tipo !== 'comercio') return null;
  const cs = S.conteos; if (cs.length < 2) return null;
  const b = cs[cs.length - 1]; let a = null;
  for (let i = cs.length - 2; i >= 0; i--) if (diasEntre(cs[i].fecha, b.fecha) >= 21) { a = cs[i]; break; }
  if (!a) return null;
  const r = resumen(addDays(a.fecha, 1), b.fecha);
  const costo = a.valor + r.compra - b.valor;
  if (!(costo > 0) || !(r.ventas > 0)) return null;
  const m = r.ventas / costo - 1;
  if (m < -0.5 || m > 3) return null;
  return {margen:m, desde:a.fecha, hasta:b.fecha, ventas:r.ventas, costo:r2(costo)};
}

/* Racha: días seguidos con cierre. Los días sin ningún movimiento (negocio cerrado) no la cortan. */
function racha(){
  const hoy = hoyISO(); let d = cierreDe(hoy) ? hoy : addDays(hoy, -1), n = 0, saltos = 0;
  const conMov = new Set(S.movs.map(m => m.fecha));
  const ini = S.perfil ? S.perfil.fechaInicio : hoy;
  while (d >= ini) {
    if (cierreDe(d)) { n++; saltos = 0; }
    else if (!conMov.has(d) && saltos < 2) saltos++;
    else break;
    d = addDays(d, -1);
  }
  return n;
}
/* Cuánto se puede sacar hoy para la casa. Lo que se saca debe salir de la ganancia:
   el menor entre la plata libre, la ganancia del mes que todavía no se sacó y lo que queda del tope semanal. */
function puedeSacar(){
  const hoy = hoyISO(), b = bolsillos(hoy), tope = S.perfil ? S.perfil.sueldoSemanal : 0;
  const mes = resumen(inicioMes(mesKey(hoy)), hoy);
  const ganMes = mes.ventas * (1 - costoPct()) - mes.gasto - mes.perdido - mes.interes;
  const porGanancia = Math.max(0, ganMes - mes.retiro);
  const resto = tope > 0 ? Math.max(0, r2(tope - resumen(inicioSemana(hoy), hoy).retiro)) : null;
  const limites = [['libre', b.libre], ['ganancia', porGanancia]]; if (resto != null) limites.push(['tope', resto]);
  limites.sort((x, y) => x[1] - y[1]);
  return {monto:Math.max(0, Math.floor(limites[0][1])), limita:limites[0][0], libre:b.libre, tope, resto, ganMes:r2(ganMes), retiroMes:mes.retiro, ventasMes:mes.ventas};
}
// Frase corta que explica el monto que se puede sacar
function fraseSacar(ps){
  if (ps.monto > 0) return {ok:true, motivo:ps.limita === 'tope' ? 'lo que queda de tu tope de la semana' : ps.limita === 'ganancia' ? 'lo que te queda de la ganancia de este mes' : 'sin tocar la plata para reponer'};
  if (ps.limita === 'libre') return {ok:false, motivo:'Hoy no conviene sacar plata para la casa: lo que hay es para reponer y cubrir tus bolsillos.'};
  if (ps.limita === 'tope') return {ok:false, motivo:'Ya llegaste a tu tope de la semana para la casa.'};
  return {ok:false, motivo:ps.ventasMes > 0 ? 'Este mes ya sacaste lo que ganó el negocio. Si sacas más, achicas tu capital.' : 'Todavía no hay ganancia para sacar: lo que tienes es tu capital para trabajar.'};
}
/* Resumen de una semana (lunes a domingo). offset 0 = esta semana, -1 = la anterior */
function semana(offset){
  const hoy = hoyISO(), a = addDays(inicioSemana(hoy), 7 * (offset || 0));
  let b = addDays(a, 6); if (b > hoy) b = hoy;
  const r = resumen(a, b);
  // Ganancia aproximada con el margen: más estable que restar las compras de una sola semana
  const ganancia = Math.round(r.ventas * (1 - costoPct()) - r.gasto - r.perdido - r.interes);
  return {desde:a, hasta:b, ventas:r.ventas, ganancia, retiro:r.retiro, fiado:r.fiado, cobro:r.cobro, n:r.n,
    cierres:S.cierres.filter(c => c.fecha >= a && c.fecha <= b).length, dias:diasEntre(a, b) + 1};
}
// La semana que conviene mostrar: la actual si ya tiene 2 días con datos; si no, la pasada
function semanaVisible(){
  const act = semana(0);
  if (act.dias >= 3 || !semana(-1).n) return {s:act, ant:semana(-1), actual:true};
  return {s:semana(-1), ant:semana(-2), actual:false};
}
function textoSemana(){
  const v = semanaVisible(), s = v.s;
  const l = ['Mi semana en Kipu' + (S.perfil ? ', ' + S.perfil.nombre : ''), 'Del ' + fechaCorta(s.desde) + ' al ' + fechaCorta(s.hasta),
    'Vendí: ' + fmt(s.ventas), 'Ganancia aproximada: ' + fmt(s.ganancia), 'Saqué para la casa: ' + fmt(s.retiro)];
  if (s.fiado || s.cobro) l.push('Fiado: di ' + fmt(s.fiado) + ', cobré ' + fmt(s.cobro));
  l.push('Cierres hechos: ' + s.cierres);
  return l.join('\n');
}

/* =========================================================
   Anotar con palabras: entiende frases como "compré 350 de mercadería"
   o "le fié 20 a doña Carmen". Siempre se confirma antes de guardar.
   ========================================================= */
const CAT_PALABRAS = [
  ['Alquiler', /alquiler|anticretico|arriendo/],
  ['Transporte', /pasaje|taxi|flete|transporte|gasolina|micro\b|trufi|carguero|moto\b/],
  ['Luz y agua', /\bluz\b|\bagua\b|internet|\bgas\b|garrafa|electricidad|cre\b|saguapac/],
  ['Sueldos', /sueldo|ayudante|empleado|jornal|salario/],
  ['Impuestos', /impuesto|patente|alcaldia|sentaje|multa/]
];
const NO_CLIENTE = /^(la|el|los|las|mi|su|sus|lo|le|me|se|que|por|con|en|y|un|una|casa|caja|mercaderia|proveedor|mayorista|banco|cajero|cuenta|negocio|credito|fiado|qr|efectivo|hoy|ayer|bs|bolivianos|pesos)$/;
function nombrePropio(s){ return s.replace(/\s+/g, ' ').trim().split(' ').map(p => p.charAt(0).toUpperCase() + p.slice(1)).join(' '); }
function interpretar(texto){
  const orig = String(texto || '').trim().slice(0, 200);
  const t = ' ' + sinAcentos(orig).replace(/[¿?¡!]/g, ' ').replace(/\s+/g, ' ') + ' ';
  const r = {texto:orig, tipo:null, monto:NaN, medio:'efectivo', cliente:'', cat:'', nota:'', fecha:hoyISO(), fondo:''};
  // Monto: el primer número, con miles o decimales
  const mm = t.match(/(\d{1,3}(?:\.\d{3})+(?:,\d{1,2})?|\d+(?:[.,]\d{1,2})?)/);
  if (mm) r.monto = parseMonto(mm[1]);
  if (/\bmil\b/.test(t) && mm && r.monto < 1000 && new RegExp(mm[1].replace('.', '\\.') + '\\s+mil\\b').test(t)) r.monto = r2(r.monto * 1000);
  if (/\bayer\b/.test(t)) r.fecha = addDays(hoyISO(), -1);
  if (/\bqr\b|transferenc|yape|\bbanco\b|tarjeta|billetera/.test(t)) r.medio = 'qr';
  const es = re => re.test(t);
  // El orden importa: de lo más específico a lo más general
  if (es(/cajero|\bdeposit/)) { r.tipo = 'cambio'; r.medio = es(/deposit/) ? 'qr' : 'efectivo'; }
  else if (es(/\bme pag(o|aron)\b|\bcobre\b|\bme cancel(o|aron)\b|\bme abon(o|aron)\b|\bpago su (fiado|deuda|cuenta)\b/)) r.tipo = 'cobro';
  else if (es(/\bfie\b|\bfiado\b|\bfiar\b|\bfiamos\b|a credito|\bme debe\b|\bquedo debiendo\b/)) r.tipo = 'fiado';
  else if (es(/adelanto|anticipo|\bsena\b/)) r.tipo = 'adelanto';
  else if (es(/\bme prestaron\b|\brecibi (un |el )?(prestamo|credito)\b|\bsaque (un )?(prestamo|credito)\b|\bme dieron (un |el )?(prestamo|credito)\b/)) r.tipo = 'prestamo';
  else if (es(/\bcuota\b|cobrador|prestamista|pasanaku|\bgota\b/)) r.tipo = 'cuota';
  else if (es(/para (la|mi) casa|\bme lleve\b|\bsaque\b|\bretire\b|\bpara mi\b|gastos? de (la )?casa|\bpersonal\b/)) r.tipo = 'retiro';
  else if (es(/\baparte\b|\bguarde\b|\bahorre\b/) && S.fondos.length) r.tipo = 'apartar';
  else if (es(/\bcompre\b|\bcompra\b|\bcompramos\b|\bsurti\b|mercaderia|proveedor|mayorista|insumos|ingredientes|materia prima|\bme surti\b/)) r.tipo = 'compra';
  else if (es(/\bvendi\b|\bventa\b|\bvendimos\b|\bvendido\b/)) r.tipo = 'venta';
  else if (es(/\bpague\b|\bgaste\b|\bgasto\b|\bpagamos\b/) || CAT_PALABRAS.some(c => c[1].test(t))) r.tipo = 'gasto';
  if (r.tipo === 'gasto') { const c = CAT_PALABRAS.find(x => x[1].test(t)); r.cat = c ? c[0] : 'Otros'; }
  if (r.tipo === 'cuota') { const d = S.deudas.find(x => x.activa && t.indexOf(' ' + sinAcentos(x.nombre) + ' ') > -1) || (S.deudas.filter(x => x.activa).length === 1 ? S.deudas.find(x => x.activa) : null); if (d) r.deuda = d.id; }
  if (r.tipo === 'apartar') { const f = S.fondos.find(x => t.indexOf(sinAcentos(x.nombre)) > -1); if (f) r.fondo = f.id; }
  if (r.tipo && TIPOS[r.tipo].cliente) {
    // Primero un cliente conocido; si no, lo que viene después de "a", "de" o "para"
    const conocidos = nombresClientes().filter(n => t.indexOf(' ' + sinAcentos(n) + ' ') > -1).sort((a, b) => b.length - a.length);
    if (conocidos.length) r.cliente = conocidos[0];
    else {
      const t2 = t.replace(/\b(a|al|de|del|para)\s+(?:la|el|los|las|mi|su)\s+/g, '$1 ');
      const m2 = t2.match(/\b(?:a|al|de|del|para)\s+((?:(?:don|dona|sr|sra|senor|senora|prof|profe|tia|tio|casera|casero)\s+)?[a-z]+(?:\s+[a-z]+)?)/);
      if (m2) {
        const palabras = m2[1].split(' ').filter(p => !NO_CLIENTE.test(p) && !/^\d/.test(p));
        if (palabras.length) {
          // Recupera la forma original (con tildes y ñ) de esas palabras
          const origPal = orig.split(/\s+/);
          const rec = palabras.map(p => origPal.find(o => sinAcentos(o).replace(/[^a-z]/g, '') === p) || p);
          r.cliente = nombrePropio(rec.join(' ').replace(/[.,;:]/g, '')).replace(/^Dona /, 'Doña ');
        }
      }
    }
  }
  if (r.tipo === 'gasto' || r.tipo === 'compra') r.nota = orig.slice(0, 140);
  return r;
}
// Dictado por voz: solo si el navegador lo ofrece (Chrome en Android, por ejemplo)
const VozAPI = window.SpeechRecognition || window.webkitSpeechRecognition || null;
let vozActiva = null;
function dictar(alTerminar){
  if (!VozAPI) { toast('Este navegador no permite dictar. Escríbelo.'); return; }
  if (vozActiva) { try { vozActiva.stop(); } catch (e) {} return; }
  let rec;
  try { rec = new VozAPI(); } catch (e) { toast('No se pudo usar el micrófono. Escríbelo.'); return; }
  rec.lang = 'es-BO'; rec.interimResults = false; rec.maxAlternatives = 1;
  const fin = () => { vozActiva = null; document.querySelectorAll('[data-act="dictar"]').forEach(b => b.classList.remove('oyendo')); };
  rec.onresult = e => { const txt = e.results && e.results[0] && e.results[0][0] ? e.results[0][0].transcript : ''; fin(); if (txt) alTerminar(txt); };
  rec.onerror = e => { fin(); toast(e && e.error === 'not-allowed' ? 'Permite el micrófono para dictar, o escríbelo.' : 'No te escuché bien. Prueba otra vez o escríbelo.'); };
  rec.onend = fin;
  try { rec.start(); vozActiva = rec; document.querySelectorAll('[data-act="dictar"]').forEach(b => b.classList.add('oyendo')); toast('Te escucho. Di, por ejemplo: compré 350 de mercadería'); }
  catch (e) { fin(); toast('No se pudo usar el micrófono. Escríbelo.'); }
}

/* =========================================================

function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function generarDemo(){
  const rnd = mulberry32(20261031);
  const R = (a, b) => a + (b - a) * rnd();
  const pick = arr => arr[Math.floor(rnd() * arr.length)];
  const hoy = hoyISO(), dh = parseISO(hoy);
  const start = iso(new Date(dh.getFullYear(), dh.getMonth() - 5, 1));
  const ds = parseISO(start);

  const movs = [], cierres = [];
  const add = (fecha, tipo, monto, x) => {
    monto = r2(monto); if (!(monto > 0)) return null;
    const m = Object.assign({id:uid(), fecha, tipo, monto, medio:'efectivo', cat:'', cliente:'', nota:'', origen:'demo', costo:null, ayud:null, fondo:'', deuda:''}, x || {});
    movs.push(m); return m;
  };
  const F = {alq:uid(), cuota:uid(), baja:uid()}, DD = {banco:uid(), gota:uid()};
  // Historia: desde el tercer mes los costos de reposición suben más rápido que los precios de venta
  const costF = [1, 1, 1.08, 1.17, 1.21, 1.2], saleF = [1, 1.01, 1.04, 1.08, 1.1, 1.12];
  const clientes = ['Doña Carmen', 'Marlene', 'Don Julio', 'Don Ramiro', 'Sra. Paola', 'Prof. Ana'];
  const deuda = {}; clientes.forEach(c => { deuda[c] = 0; });
  let inv = 9000; const conteos = [{id:uid(), fecha:start, valor:inv}];
  let cuRel = 0;
  add(addDays(start, 2), 'prestamo', 8000, {medio:'qr', nota:'Crédito del banco para surtir'}); cuRel += 8000;
  add(addDays(start, 3), 'compra', 5000, {medio:'qr', nota:'Surtido grande con el crédito'}); cuRel -= 5000; inv += 5000;
  // Préstamo del cobrador diario: 12 días hábiles antes de hoy
  let gotaIni = hoy, habiles = 0;
  while (habiles < 12) { gotaIni = addDays(gotaIni, -1); if (parseISO(gotaIni).getDay() !== 0) habiles++; }
  add(gotaIni, 'prestamo', 3000, {nota:'Préstamo del cobrador diario'});
  // Un fiado que nunca se cobró y un pedido con adelanto
  add(addDays(start, 20), 'fiado', 85, {cliente:'Vecino del segundo piso'});
  add(addDays(start, 81), 'perdido', 85, {cliente:'Vecino del segundo piso', nota:'Se mudó sin pagar'});
  add(addDays(hoy, -40), 'adelanto', 100, {cliente:'Doña Carmen', nota:'Pedido de canasta familiar'});
  add(addDays(hoy, -33), 'entrega', 100, {cliente:'Doña Carmen', nota:'Canasta familiar entregada'});
  add(addDays(hoy, -6), 'adelanto', 150, {cliente:'Sra. Paola', medio:'qr', nota:'Pedido de canasta familiar'}); cuRel += 150;

  let d = start, porReponer = 0;
  while (d <= hoy) {
    const dt = parseISO(d), dow = dt.getDay(), dom = dt.getDate();
    const mi = Math.min(5, (dt.getFullYear() - ds.getFullYear()) * 12 + dt.getMonth() - ds.getMonth());
    const ratio = 0.78 * costF[mi] / saleF[mi];
    const conCierre = d >= inicioCierres && d < hoy;
    const org = conCierre ? 'cierre' : 'demo';
    if (dow !== 0) {
      let ventaEf = 0, ventaQr = 0, qrIn = 0;
      if (d < hoy && rnd() > 0.03) {
        const base = (dow === 6 ? 980 : 810) * saleF[mi] * R(0.85, 1.15);
        const qr = Math.min(0.6, 0.32 + 0.035 * mi + R(-0.05, 0.05));
        ventaEf = Math.round(base * (1 - qr)); ventaQr = Math.round(base * qr);
        porReponer += base * ratio; inv -= base * ratio;
      }
      if (rnd() < 0.45) { const c = pick(clientes), m = Math.round(R(10, 120)); add(d, 'fiado', m, {cliente:c}); deuda[c] += m; porReponer += m * ratio; inv -= m * ratio; }
      if (rnd() < 0.42) {

        if (cand.length) {
          const c = pick(cand); let m = Math.round(Math.min(deuda[c], R(30, deuda[c]))); if (deuda[c] - m < 10 || rnd() < 0.5) m = deuda[c];
          const medio = rnd() < 0.4 ? 'qr' : 'efectivo';

        add(d, 'venta', ventaQr, {origen:org, medio:'qr', nota:conCierre ? 'Ventas por QR del día' : 'Cobros por QR del día'});

        if (diasEntre(start, d) > 25) add(d, 'apartar', 30, {origen:org, fondo:F.cuota});
        if (mi >= 3) add(d, 'apartar', 15, {origen:org, fondo:F.baja});
        if (conCierre) cierres.push({fecha:d, ventasEf:ventaEf, ventasQr:ventaQr, qr:r2(ventaQr + qrIn), personal:0, faltante:0});
      }

    }
    if ((dow === 2 || dow === 5) && 1500 + cuRel > 2600 && d < hoy) { const v = Math.floor((cuRel - 400) / 100) * 100; add(d, 'cambio', v, {nota:'Saqué del cajero para el proveedor'}); cuRel -= v; }
    if ((dow === 2 || dow === 5) && porReponer > 0 && d < hoy) {

    if (dom === 12) add(d, 'gasto', Math.round(R(120, 165)), {cat:'Luz y agua'});
    if (dom === 3 && diasEntre(start, d) > 25) { add(d, 'cuota', 740, {medio:'qr', fondo:F.cuota, deuda:DD.banco, nota:'Cuota del crédito'}); cuRel -= 740; }
    if (rnd() < 0.06 && d < hoy) add(d, 'gasto', Math.round(R(15, 70)), {cat:'Otros', nota:pick(['Bolsas','Limpieza','Recarga del celular','Reparación de la balanza'])});
    if (dow === 6 && d < hoy) add(d, 'retiro', Math.round(R(560, 720) * (mi >= 3 ? 1.12 : 1)), {nota:'Gastos de la casa'});
    if (mi === 3 && dom === 20) add(d, 'retiro', 650, {nota:'Útiles del colegio'});

  // Plata inicial suficiente para que ni el efectivo ni la cuenta queden en negativo
  const correr = (ef, cu, cb) => {
    let minEf = ef, minCu = cu;
    movs.forEach((m, i) => {
      const t = TIPOS[m.tipo];

      else if (t.caja) { if (m.medio === 'qr') cu += t.signo * m.monto; else ef += t.signo * m.monto; }
      minEf = Math.min(minEf, ef); minCu = Math.min(minCu, cu);

    });

  const hace = n => addDays(hoy, -n);
  return normalizar({

      {id:uid(), nombre:'Don Ramiro', grupo:'Puesto del mercado', telefono:'', rapido:0},

    ],
    fondos:[
      {id:F.alq, nombre:'Alquiler', meta:900, frecuencia:'mensual', porDia:35},
      {id:F.cuota, nombre:'Cuota del banco', meta:740, frecuencia:'mensual', porDia:30, deuda:DD.banco},
      {id:F.baja, nombre:'Temporada baja', meta:2000, frecuencia:'libre', porDia:15}

function barraBolsillos(b, grande){
  const partes = [['s-rep', b.rep, 'Para reponer mercadería'], ['s-fondo', b.totalFondos, 'Apartado en bolsillos'], ['s-adel', r2(b.adelantos + b.ayud), b.ayud > 0 ? 'Adelantos y ayudante' : 'Adelantos de pedidos'], ['s-libre', Math.max(0, b.libre), 'Plata libre']];

  const tot = Math.max(1, partes.reduce((t, p) => t + Math.max(0, p[1]), 0) + falta);

  const leyenda = partes.filter(p => p[1] > 0.004 || p[0] === 's-libre').map(p => '<span><i class="sw ' + p[0] + '"></i>' + p[2] + ' <b>' + fmt(p[0] === 's-libre' ? b.libre : p[1]) + '</b></span>').join('') +

// Avanza o retrocede en los pasos de la bienvenida, validando lo mínimo
function bvIr(f, delta){
  const n = +f.dataset.paso || 1, act = f.querySelector('.bv-paso[data-paso="' + n + '"]'), err = act.querySelector('.bv-err');
  err.innerHTML = '';
  if (delta > 0) {
    if (n === 1 && !f.elements.nombre.value.trim()) { err.innerHTML = errsHTML(['Escribe el nombre de tu negocio.']); f.elements.nombre.focus(); return false; }
    if (n === 2) {
      const g = k => f.elements[k].value, ef = montoCampo(g, 'efectivo'), cu = montoCampo(g, 'cuenta');
      if (!Number.isFinite(ef) || ef < 0) { err.innerHTML = errsHTML(['Revisa el efectivo: escribe solo números.']); f.elements.efectivo.focus(); return false; }
      if (!Number.isFinite(cu) || cu < 0) { err.innerHTML = errsHTML(['Revisa la plata de tu cuenta: escribe solo números.']); f.elements.cuenta.focus(); return false; }
    }
  }
  const sig = Math.max(1, Math.min(3, n + delta)); if (sig === n) return true;
  f.querySelectorAll('.bv-paso').forEach(p => { p.hidden = +p.dataset.paso !== sig; });
  f.dataset.paso = sig;
  const h = f.querySelector('.bv-paso[data-paso="' + sig + '"] h2'); if (h) h.focus({preventScroll:true});
  const primero = f.querySelector('.bv-paso[data-paso="' + sig + '"] input[type="text"]'); if (primero && sig === 2) primero.focus();
  return true;
}

function leerCierre(f){

    apertura:ap === '' ? NaN : parseMonto(ap), apartados, falt:falt ? falt.value : 'dif'};
}

function guardarCierre(v){
  const c = calcCierre(v.fecha, v.efectivo, v.qr, v.personal, v.apertura);
  const cada = S.perfil.modoVentas === 'cada';
  S.movs = S.movs.filter(m => !(m.fecha === v.fecha && m.origen === 'cierre'));
  S.cierres = S.cierres.filter(x => x.fecha !== v.fecha);
  const ay = S.ajustes.ayudante;
  const push = (tipo, monto, x) => {
    monto = r2(monto); if (!(monto > 0)) return;
    S.movs.push(Object.assign({id:uid(), fecha:v.fecha, tipo, monto, medio:'efectivo', cat:'', cliente:'', nota:'', origen:'cierre', costo:null, ayud:null, fondo:'', deuda:''}, x || {}));
  };
  const ajuste = r2(c.apertura - c.aperturaCalc);
  if (ajuste < -0.004) push('retiro', -ajuste, {nota:'Ajuste: faltaba plata al abrir la caja'});
  else if (ajuste > 0.004) push('aporte', ajuste, {nota:'Ajuste: sobraba plata al abrir la caja'});
  push('venta', c.ventasEf, {nota:cada ? 'Ventas en efectivo sin anotar' : 'Ventas en efectivo del día', ayud:ay ? r2(c.ventasEf * ay.pct / 100) : null});
  push('venta', c.ventasQr, {medio:'qr', nota:cada ? 'Ventas por QR sin anotar' : 'Ventas por QR del día', ayud:ay ? r2((c.ventasQr || 0) * ay.pct / 100) : null});
  if (v.personal > 0) push('aporte', v.personal, {medio:'qr', nota:'Plata personal que entró por QR'});
  if (c.faltante > 0) {
    if (v.falt === 'retiro') push('retiro', c.faltante, {nota:'Faltante del cierre: lo saqué para la casa'});
    else push('gasto', c.faltante, {cat:'Otros', nota:v.falt === 'gasto' ? 'Faltante del cierre: gasto sin anotar' : 'Diferencia de caja'});
  }
  v.apartados.forEach(a => push('apartar', a.monto, {fondo:a.id, nota:'Apartado en el cierre'}));
  S.cierres.push({fecha:v.fecha, efectivo:r2(v.efectivo), qr:Number.isFinite(v.qr) ? r2(v.qr) : 0, personal:v.personal > 0 ? r2(v.personal) : 0, qrPend:!!v.qrPend,
    apertura:r2(c.apertura), ventasEf:c.ventasEf || 0, ventasQr:c.ventasQr || 0, faltante:c.faltante || 0});
  ordenar(); guardar();
  return c;
}
function guardarQrPend(f){

function niceMax(v){ if (v <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))), f = v / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p; }
function anchoChart(){ const w = main.clientWidth ? main.clientWidth - 56 : 0; return Math.max(300, Math.min(720, w || 300)); }
function chartAnio(rows){
  const W = anchoChart(), H = W < 480 ? 230 : 270, L = 58, Rm = 10, T = 14, B = 30, iw = W - L - Rm, ih = H - T - B;
  const con = rows.filter(x => x.r);
  const max = niceMax(Math.max(1, ...con.map(x => Math.max(x.r.entro, x.r.salio, x.saldo))));
  const minS = Math.min(0, ...con.map(x => x.saldo)), min = minS < 0 ? -niceMax(-minS) : 0;
  const y = v => T + ih - (v - min) / (max - min) * ih;
  const gw = iw / 12, bw = Math.max(3, Math.min(16, gw * 0.3));
  let g = '';
  for (let i = 0; i <= 4; i++) { const v = min + (max - min) * i / 4, yy = y(v).toFixed(1); g += '<line class="grid" x1="' + L + '" x2="' + (W - Rm) + '" y1="' + yy + '" y2="' + yy + '"/><text x="' + (L - 8) + '" y="' + (+yy + 4) + '" text-anchor="end">' + fmtCorto(v) + '</text>'; }
  if (min < 0) g += '<line class="zero" x1="' + L + '" x2="' + (W - Rm) + '" y1="' + y(0).toFixed(1) + '" y2="' + y(0).toFixed(1) + '"/>';
  let bars = ''; const pts = [];
  rows.forEach((x, i) => {
    const cx = L + i * gw + gw / 2;
    g += '<text x="' + cx.toFixed(1) + '" y="' + (H - 9) + '" text-anchor="middle">' + MESES_C[i] + '</text>';
    if (!x.r) return;
    const y0 = y(0);
    const hIn = Math.max(0, y0 - y(x.r.entro)), hOut = Math.max(0, y0 - y(x.r.salio));
    bars += '<rect class="b-in" x="' + (cx - bw - 1).toFixed(1) + '" y="' + (y0 - hIn).toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + hIn.toFixed(1) + '" rx="2"><title>' + MESES[i] + ': entró ' + fmt(x.r.entro) + '</title></rect>';
    bars += '<rect class="b-out" x="' + (cx + 1).toFixed(1) + '" y="' + (y0 - hOut).toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + hOut.toFixed(1) + '" rx="2"><title>' + MESES[i] + ': salió ' + fmt(x.r.salio) + '</title></rect>';
    pts.push([cx, y(x.saldo), x.saldo, i]);
  });
  const line = pts.length > 1 ? '<polyline class="l-saldo" points="' + pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ') + '"/>' : '';
  const dots = pts.map(p => '<circle class="d-saldo" cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="4"><title>' + MESES[p[3]] + ': plata ' + fmt(p[2]) + '</title></circle>').join('');
  return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Gráfico de barras de lo que entró y salió cada mes, con la plata al cierre de cada mes. Los valores están en la tabla de abajo.">' + g + bars + line + dots + '</svg>';
}
function chartCaja(a, b){
  const W = anchoChart(), H = W < 480 ? 170 : 200, L = 58, Rm = 10, T = 12, B = 28, iw = W - L - Rm, ih = H - T - B;
  const n = diasEntre(a, b) + 1;
  const delta = {};
  movsEntre(a, b).forEach(m => { const t = TIPOS[m.tipo]; if (t.caja) delta[m.fecha] = (delta[m.fecha] || 0) + t.signo * m.monto; });
  let s = cajaHasta(addDays(a, -1)); const serie = [];
  for (let i = 0; i < n; i++) { const f = addDays(a, i); s += delta[f] || 0; serie.push(r2(s)); }
  const hi = Math.max(...serie, 0), lo = Math.min(...serie, 0);
  const max = niceMax(Math.max(1, hi)), min = lo < 0 ? -niceMax(-lo) : 0;
  const y = v => T + ih - (v - min) / (max - min) * ih;
  const x = i => L + (n === 1 ? iw / 2 : i / (n - 1) * iw);
  let g = '';
  for (let i = 0; i <= 3; i++) { const v = min + (max - min) * i / 3, yy = y(v).toFixed(1); g += '<line class="grid" x1="' + L + '" x2="' + (W - Rm) + '" y1="' + yy + '" y2="' + yy + '"/><text x="' + (L - 8) + '" y="' + (+yy + 4) + '" text-anchor="end">' + fmtCorto(v) + '</text>'; }
  if (min < 0) g += '<line class="zero" x1="' + L + '" x2="' + (W - Rm) + '" y1="' + y(0).toFixed(1) + '" y2="' + y(0).toFixed(1) + '"/>';
  const marcas = [0, Math.floor((n - 1) / 2), n - 1].filter((v, i, arr) => arr.indexOf(v) === i);
  marcas.forEach(i => { g += '<text x="' + x(i).toFixed(1) + '" y="' + (H - 8) + '" text-anchor="' + (i === 0 ? 'start' : i === n - 1 ? 'end' : 'middle') + '">' + fechaCorta(addDays(a, i)) + '</text>'; });
  const pts = serie.map((v, i) => x(i).toFixed(1) + ',' + y(v).toFixed(1));
  const area = '<polygon class="area" points="' + x(0).toFixed(1) + ',' + y(Math.max(min, 0)).toFixed(1) + ' ' + pts.join(' ') + ' ' + x(n - 1).toFixed(1) + ',' + y(Math.max(min, 0)).toFixed(1) + '"/>';
  const ultimo = serie[serie.length - 1];
  return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Plata del negocio día a día, sumando efectivo y cuenta. Empezó en ' + fmt(serie[0]) + ' y terminó en ' + fmt(ultimo) + '.">' + g + area + '<polyline class="l-caja" points="' + pts.join(' ') + '"/></svg>';
}

    const msg = 'Hola ' + c.nombre + ', te escribo de ' + negocio + '. Tienes una cuenta pendiente de ' + fmt(c.debe) + (c.desde ? ' desde el ' + fechaCorta(c.desde) : '') + '. Cuando puedas, me avisas. ¡Gracias!';
    const hist = c.movs.slice(-8).reverse().map(m => '<li><span>' + fechaCorta(m.fecha) + ', ' + {fiado:'llevó fiado', cobro:'pagó', perdido:'se dio por perdido', adelanto:'dejó adelanto', entrega:'se entregó su pedido'}[m.tipo] + '</span><span class="num ' + (m.tipo === 'fiado' ? 'out' : 'in') + '">' + fmt(m.monto) + '</span></li>').join('');
    return '<li class="cli' + (dias > 30 || (c.tope > 0 && c.debe > c.tope) ? ' viejo' : '') + '"><div class="cli-h"><strong>' + esc(c.nombre) + (c.grupo ? ' <span class="tag">' + esc(c.grupo) + '</span>' : '') + (c.tope > 0 && c.debe > c.tope ? ' <span class="tag tag-out">pasó su límite de ' + fmt(c.tope) + '</span>' : '') + '</strong><span class="cli-m num">' + fmt(c.debe) + '</span></div>' +
      '<p class="note">' + (c.desde ? 'Debe desde el ' + fechaCorta(c.desde) + (dias > 0 ? ', hace ' + dias + (dias === 1 ? ' día' : ' días') : ', hoy') : '') + (dias > 30 ? '. Lleva más de un mes.' : '') + '</p>' +
      '<div class="btn-row" style="margin:6px 0 0"><button type="button" class="btn btn-in" data-act="anotar" data-tipo="cobro" data-cliente="' + esc(c.nombre) + '">' + ic('entra') + 'Me pagó</button>' +
      (c.rapido > 0 ? '<button type="button" class="btn" data-act="fiado-rapido" data-cliente="' + esc(c.nombre) + '">' + ic('fiado') + 'Fiado de ' + fmt(c.rapido) + '</button>' : '<button type="button" class="btn" data-act="anotar" data-tipo="fiado" data-cliente="' + esc(c.nombre) + '">' + ic('fiado') + 'Fiado</button>') +
      '<a class="btn" href="' + esc(waLink(c.telefono, msg)) + '" target="_blank" rel="noopener">' + ic('chat') + 'Recordar' + (c.telefono ? '' : ' por WhatsApp') + '</a></div>' +
      '<details><summary>Historial y opciones</summary><ul class="mini">' + hist + '</ul>' +
      '<div class="btn-row"><button type="button" class="btn btn-ghost" data-act="cliente-editar" data-cliente="' + esc(c.nombre) + '">' + ic('editar') + (c.telefono ? 'Editar datos' : 'Agregar teléfono o grupo') + '</button>' +
      (c.rapido > 0 ? '<button type="button" class="btn btn-ghost" data-act="anotar" data-tipo="fiado" data-cliente="' + esc(c.nombre) + '">Fiado de otro monto</button>' : '') +
      '<button type="button" class="btn btn-danger" data-act="fiado-perdido" data-cliente="' + esc(c.nombre) + '">Dar por perdido</button></div></details></li>';
  };
  return '<h1>Fiado</h1>' +
    (deben.length ? '<p class="lead">Te deben <strong class="out num">' + fmt(total) + '</strong> entre ' + deben.length + (deben.length === 1 ? ' cliente' : ' clientes') + (ui.grupo ? ' de este grupo' : '') + '.</p>' : '<p class="lead">Nadie ' + (ui.grupo ? 'de este grupo ' : '') + 'te debe por ahora.</p>') +
    '<div class="btn-row"><button type="button" class="btn btn-pri" data-act="anotar" data-tipo="fiado">' + ic('fiado') + 'Anotar un fiado</button><button type="button" class="btn" data-act="anotar" data-tipo="cobro">' + ic('entra') + 'Anotar un pago</button><button type="button" class="btn btn-ghost" data-act="cliente-editar">' + ic('mas') + 'Agregar cliente</button></div>' +
    chips +
    (deben.length ? '<ul class="clientes">' + deben.map(tarjeta).join('') + '</ul>' : vacioHTML('Cuando vendas fiado, anótalo aquí para saber quién te debe y desde cuándo. Puedes agrupar a tus clientes por cuadra, ruta o puesto.', false)) +
    (aldia.length ? '<h2>Al día</h2><ul class="aldia">' + aldia.map(c => '<li><span>' + esc(c.nombre) + (c.grupo ? ' <span class="tag">' + esc(c.grupo) + '</span>' : '') + (c.movs.some(m => m.tipo === 'perdido') ? ' <span class="tag">tuvo un fiado perdido</span>' : '') + '</span>' +
      (c.rapido > 0 ? '<button type="button" class="btn btn-ghost" data-act="fiado-rapido" data-cliente="' + esc(c.nombre) + '">Fiado de ' + fmt(c.rapido) + '</button>' : '<button type="button" class="btn btn-ghost" data-act="anotar" data-tipo="fiado" data-cliente="' + esc(c.nombre) + '">Fiado</button>') +
      '<button type="button" class="icon-btn" data-act="cliente-editar" data-cliente="' + esc(c.nombre) + '" aria-label="Editar ' + esc(c.nombre) + '">' + ic('editar') + '</button></li>').join('') + '</ul>' : '') +
    '<p class="note" style="margin-top:14px">El monto de fiado rápido se configura en los datos de cada cliente. Sirve para quien lleva casi siempre lo mismo.</p>';
}

/* ---------- Deudas ---------- */
const pctTasa = x => x > 10 ? 'más de 1.000%' : pct(x * 100);
const unidadFrec = (f, n) => ({diaria:n === 1 ? 'día' : 'días', semanal:n === 1 ? 'semana' : 'semanas', quincenal:n === 1 ? 'quincena' : 'quincenas', mensual:n === 1 ? 'mes' : 'meses'})[f];
function deudaCardHTML(d){
  const c = costoDeuda(d);
  const tone = !c ? '' : c.mensual > 0.05 ? 'malo' : c.mensual > 0.025 ? 'medio' : 'bueno';
  const fondo = S.fondos.find(f => f.deuda === d.id);
  let cuerpo;
  if (!c) cuerpo = '<p class="note">Faltan datos para calcular el costo: monto recibido, cuota y número de cuotas.</p>';
  else {
    const cada100 = d.soloInteres ? null : r2(c.total / d.recibido * 100);
    cuerpo = '<p class="cap">Te cuesta</p><p class="big">' + pctTasa(c.mensual) + ' al mes</p>' +
      '<p>' + (d.soloInteres ? 'Pagas ' + fmt(d.cuota) + ' de interés ' + FRECUENCIAS[d.frecuencia].toLowerCase() + ' y todavía debes los ' + fmt(d.recibido) + '.'
        : 'Por cada Bs 100 que te prestaron devuelves Bs ' + String(cada100).replace('.', ',') + ' en ' + d.nCuotas + ' ' + unidadFrec(d.frecuencia, d.nCuotas) + '.') +
      (tone === 'malo' ? ' Es plata muy cara.' : '') + '</p>' +
      '<dl class="kv"><dt>Te prestaron</dt><dd>' + fmt(d.recibido) + '</dd><dt>Cuota</dt><dd>' + fmt(d.cuota) + ', ' + FRECUENCIAS[d.frecuencia].toLowerCase() + '</dd>' +
      (c.total != null ? '<dt>Total que devuelves</dt><dd>' + fmt(c.total) + '</dd><dt>De eso, intereses</dt><dd>' + fmt(c.interes) + '</dd>' : '') +
      '<dt>Pagaste hasta hoy</dt><dd>' + fmt(c.pagado) + ' (' + c.nPagos + (c.nPagos === 1 ? ' pago' : ' pagos') + ')</dd>' +
      (c.restantes != null ? '<dt>Te faltan</dt><dd>' + c.restantes + ' ' + (c.restantes === 1 ? 'cuota' : 'cuotas') + ', ' + fmt(c.pendiente) + '</dd>' : '') +
      '<dt>Costo al año</dt><dd>' + pctTasa(c.anual) + '</dd>' +
      '<dt>Aparta por día que abres</dt><dd>' + fmt(c.porDia) + '</dd></dl>';
  }
  return '<li class="res ' + tone + ' deuda"><div class="cli-h"><strong>' + esc(d.nombre) + ' <span class="tag">' + TIPOS_DEUDA[d.tipo] + '</span></strong>' + (d.activa ? '' : '<span class="tag">Pagada</span>') + '</div>' + cuerpo +
    '<div class="btn-row">' + (d.activa ? '<button type="button" class="btn btn-pri" data-act="anotar" data-tipo="cuota" data-deuda="' + esc(d.id) + '"' + (fondo ? ' data-fondo="' + esc(fondo.id) + '"' : '') + '>' + ic('banco') + 'Pagué una cuota</button>' +
      (!fondo && d.cuota > 0 ? '<button type="button" class="btn" data-act="deuda-fondo" data-id="' + esc(d.id) + '">' + ic('bolsillo') + 'Crear bolsillo para la cuota</button>' : '') : '') +
    '<button type="button" class="btn btn-ghost" data-act="deuda-editar" data-id="' + esc(d.id) + '">' + ic('editar') + 'Editar</button>' +
    '<button type="button" class="btn btn-ghost" data-act="deuda-activa" data-id="' + esc(d.id) + '">' + (d.activa ? 'Ya la terminé de pagar' : 'Volver a activar') + '</button></div></li>';
}
function vDeudas(){
  const act = S.deudas.filter(d => d.activa), ina = S.deudas.filter(d => !d.activa);
  const porDia = r2(act.reduce((t, d) => { const c = costoDeuda(d); return t + (c ? c.porDia : 0); }, 0));
  return '<h1>Mis deudas</h1>' +
    '<p class="lead">Anota lo que debes, también lo informal: prestamista, cobrador diario, pasanaku o un familiar. Kipu calcula cuánto te cuesta de verdad cada uno.</p>' +
    (act.length ? '<div class="res" style="margin-top:14px"><p class="cap">Para tus cuotas</p><p class="big num">Aparta ' + fmt(porDia) + ' por día</p><p>Así llegas a cada pago sin sacar de la plata para reponer mercadería. Cuenta ' + Math.round(diasMes()) + ' días de trabajo al mes.</p></div>' : '') +
    '<div class="btn-row"><button type="button" class="btn btn-pri" data-act="deuda-nueva">' + ic('mas') + 'Agregar una deuda</button></div>' +
    (act.length ? '<ul class="deudas">' + act.map(deudaCardHTML).join('') + '</ul>' : vacioHTML('No tienes deudas anotadas.', false)) +
    (ina.length ? '<details style="margin-top:18px"><summary class="muted">Deudas que ya terminaste de pagar (' + ina.length + ')</summary><ul class="deudas" style="margin-top:10px">' + ina.map(deudaCardHTML).join('') + '</ul></details>' : '') +
    '<p class="note" style="margin-top:14px">El costo sale de tus propios datos: lo que recibiste, la cuota y cuántas cuotas pagas. Si te cobraron seguros o comisiones, réstalos de lo recibido para verlos en el costo. Compara con la tasa efectiva que te ofrezca un banco o cooperativa.</p>';
}

/* ---------- Precio y dólar ---------- */
function vPrecio(){
  const tc = S.ajustes.tc, usdN = S.productos.filter(p => p.costoUsd > 0).length;
  const prods = S.productos.map(p => {
    const costo = costoProducto(p), r = calcPrecio(Object.assign({}, p, {costoNuevo:costo})) || {};
    const lbl = {malo:'Pierde capital', medio:'Gana poco', bueno:'Bien'}[r.estado] || 'Sin precio';
    return '<li><button type="button" class="mov" data-act="prod-cargar" data-id="' + esc(p.id) + '">' +
      '<span class="mov-ic neu">' + ic('precio') + '</span><span><span class="mov-n">' + esc(p.nombre) + (p.costoUsd > 0 ? ' <span class="tag">en dólares</span>' : '') + '</span><span class="mov-d">Vendes a ' + fmt(p.precio) + ', reponer cuesta ' + fmt(costo) + (p.costoUsd > 0 ? ' (US$ ' + numTxt(p.costoUsd) + ')' : '') + '</span></span>' +
      '<span class="estado ' + (r.estado || '') + '">' + lbl + '</span></button></li>';
  }).join('');

    '<p class="lead">Cuando el proveedor sube el precio, vender al precio de antes puede dejarte sin plata para volver a comprar.</p>' +
    '<form class="panel tc-panel" id="f-tc" novalidate style="margin-top:16px"><div class="tc-fila">' +
    '<label class="campo" style="margin:0;flex:1 1 200px"><span class="lbl">Dólar de hoy (bolivianos por dólar)</span><input type="text" inputmode="decimal" name="tc" autocomplete="off" placeholder="Por ejemplo, 12,10" value="' + numTxt(tc) + '"></label>' +
    '<button type="submit" class="btn btn-pri">Guardar</button></div>' +
    '<p class="note' + (tcViejo ? ' warn-txt' : '') + '" style="margin:8px 0 0">' + (tc > 0 ? 'Anotado el ' + fechaCorta(S.ajustes.tcFecha || hoyISO()) + '. ' : '') + 'Usa el precio al que te cobra tu proveedor o al que consigues los dólares. ' + (usdN ? 'Se recalculan ' + usdN + (usdN === 1 ? ' producto' : ' productos') + ' en dólares.' : '') + '</p><div id="tc-err" role="alert"></div></form>' +
    '<div class="dos" style="margin-top:16px"><form class="panel" id="f-precio" novalidate>' +
    '<input type="hidden" name="id" value="">' +
    '<label class="campo"><span class="lbl">Producto</span><input type="text" name="nombre" maxlength="60" autocomplete="off" placeholder="Por ejemplo, Aceite 1 L"></label>' +
    '<label class="check"><input type="checkbox" name="usd" ' + (ui.precioUsd ? 'checked' : '') + '><span>Lo pago en dólares</span></label>' +
    '<div id="p-usd" ' + (ui.precioUsd ? '' : 'hidden') + '><label class="campo"><span class="lbl">Costo en dólares</span><input type="text" inputmode="decimal" name="costoUsd" autocomplete="off" placeholder="0,00"><span class="ayuda">' + (tc > 0 ? 'Se multiplica por el dólar de hoy: ' + numTxt(tc) + '.' : 'Primero anota el dólar de hoy, arriba.') + '</span></label></div>' +
    '<div class="grid2"><label class="campo"><span class="lbl">Te costaba antes</span><input type="text" inputmode="decimal" name="costoAnt" autocomplete="off" placeholder="Opcional"></label>' +
    '<label class="campo"><span class="lbl">Te cuesta reponer hoy</span><input type="text" inputmode="decimal" name="costoNuevo" autocomplete="off" placeholder="0"></label></div>' +
    '<div class="grid2"><label class="campo"><span class="lbl">Lo vendes a</span><input type="text" inputmode="decimal" name="precio" autocomplete="off" placeholder="0"></label>' +
    '<label class="campo"><span class="lbl">Quieres ganar (%)</span><input type="text" inputmode="decimal" name="markup" value="' + numTxt(S.perfil.margen || 20) + '" autocomplete="off"><span class="ayuda">Sobre lo que te cuesta reponer.</span></label></div>' +
    '<div id="p-err" role="alert"></div>' +
    '<div class="btn-row"><button type="submit" class="btn btn-pri">Guardar producto</button><button type="button" class="btn btn-ghost" data-act="prod-limpiar">Limpiar</button><button type="button" class="btn btn-ghost" data-act="prod-borrar" hidden>Borrar</button></div>' +
    '</form><div id="precio-res" aria-live="polite">' + precioResHTML(null) + '</div></div>' +
    '<h2>Tus productos</h2>' +
    (prods ? '<ul class="lista">' + prods + '</ul><p class="note" style="margin-top:8px">Toca un producto para revisarlo o actualizar su costo.</p>' : vacioHTML('Guarda los productos que más vendes para revisarlos cuando suba el dólar o el proveedor.', false));
}
function leerPrecio(f){
  const g = n => parseMonto(f.elements[n].value);
  const usd = f.elements.usd.checked;
  let costoNuevo = g('costoNuevo'), costoUsd = 0;
  if (usd) { costoUsd = g('costoUsd'); costoNuevo = costoUsd > 0 && S.ajustes.tc > 0 ? r2(costoUsd * S.ajustes.tc) : NaN; }
  const mk = g('markup');
  return {nombre:f.elements.nombre.value.trim(), costoAnt:g('costoAnt'), costoNuevo, costoUsd:usd && costoUsd > 0 ? costoUsd : 0, precio:g('precio'), markup:Number.isFinite(mk) && mk >= 0 ? mk : 20, usd};
}
function precioResHTML(v){
  const r = v ? calcPrecio(v) : null;
  if (!r) return '<div class="res"><p class="cap">Resultado</p><p class="big">Escribe cuánto te cuesta reponer</p><p>Con eso te digo a cuánto vender para no perder capital.</p></div>';
  const kv = '<dl class="kv"><dt>Te cuesta reponer</dt><dd>' + fmt(v.costoNuevo) + '</dd><dt>Precio para ganar ' + pct(v.markup) + '</dt><dd>' + fmt(r.sugerido) + '</dd>' +
    (r.real != null ? '<dt>Ganancia real por unidad</dt><dd class="' + (r.real >= 0 ? 'in' : 'out') + '">' + fmt(r.real) + '</dd>' : '') +
    (r.aparente != null ? '<dt>Ganancia que parece, con el costo de antes</dt><dd>' + fmt(r.aparente) + '</dd>' : '') + '</dl>';
  if (r.estado === 'malo') return '<div class="res malo"><p class="cap">A tu precio de hoy</p><p class="big">Pierdes ' + fmt(-r.real) + ' por unidad</p>' +
    '<p>Con lo que cobras no alcanza para volver a comprar el producto. Cada venta achica tu capital. Para ganar ' + pct(v.markup) + ', véndelo a <strong>' + fmt(r.sugerido) + '</strong>.</p>' +
    (r.aparente > 0 ? '<p>Si lo comparas con lo que te costaba antes parece que ganas ' + fmt(r.aparente) + ', pero reponerlo ahora cuesta ' + fmt(v.costoNuevo) + '.</p>' : '') + kv + '</div>';
  if (r.estado === 'medio') return '<div class="res medio"><p class="cap">A tu precio de hoy</p><p class="big">Ganas ' + fmt(r.real) + ' por unidad</p>' +
    '<p>Es ' + pct(r.realPct) + ', menos del ' + pct(v.markup) + ' que buscas. Para lograrlo, véndelo a <strong>' + fmt(r.sugerido) + '</strong>.</p>' + kv + '</div>';
  if (r.estado === 'bueno') return '<div class="res bueno"><p class="cap">A tu precio de hoy</p><p class="big">Ganas ' + fmt(r.real) + ' por unidad</p>' +
    '<p>Es ' + pct(r.realPct) + ' sobre lo que cuesta reponerlo. Tu precio cubre la reposición y la ganancia que buscas.</p>' + kv + '</div>';
  return '<div class="res"><p class="cap">Precio sugerido</p><p class="big">Véndelo a ' + fmt(r.sugerido) + '</p><p>Así recuperas lo que cuesta reponerlo y ganas ' + pct(v.markup) + '. Redondeado a los 50 centavos.</p>' + kv + '</div>';
}

/* ---------- Recuperar un lote ---------- */
function loteResHTML(l){
  const r = l ? calcLote(l) : null;
  if (!r) return '<div class="res"><p class="cap">Resultado</p><p class="big">Escribe cuánto pagaste y cuántas unidades son</p><p>Te digo el precio mínimo y cuántas unidades tienes que vender para recuperar tu plata.</p></div>';
  if (!(l.precio > 0)) return '<div class="res"><p class="cap">Precio mínimo</p><p class="big">' + fmt(r.minimo) + ' por unidad</p><p>Es lo que te costó cada unidad. Vender por debajo de eso es perder plata. Escribe a cuánto vas a vender para ver cuándo recuperas.</p></div>';
  if (!r.alcanza) return '<div class="res malo"><p class="cap">A ' + fmt(l.precio) + ' por unidad</p><p class="big">No recuperas lo que pagaste</p><p>Aunque vendas las ' + l.unidades + ' unidades juntas ' + fmt(l.unidades * l.precio) + ', menos que los ' + fmt(l.costo) + ' que pagaste. El precio mínimo es ' + fmt(r.minimo) + '.</p></div>';
  return '<div class="res bueno"><p class="cap">A ' + fmt(l.precio) + ' por unidad</p><p class="big">Recuperas tu plata al vender ' + r.recuperaEn + ' unidades</p>' +
    '<p>Hasta ahí, toda la venta es para volver a comprar. Desde la unidad ' + (r.recuperaEn + 1) + ' empieza tu ganancia.</p>' +
    '<dl class="kv"><dt>Precio mínimo por unidad</dt><dd>' + fmt(r.minimo) + '</dd><dt>Si vendes todo, ganas</dt><dd>' + fmt(r.gananciaTotal) + '</dd><dt>Unidades que sobran para ganar</dt><dd>' + (l.unidades - r.recuperaEn) + '</dd></dl></div>';
}
function vLote(){
  const lista = S.lotes.slice().reverse().map(l => {
    const r = calcLote(l) || {};
    const pc = r.progreso != null ? r.progreso * 100 : 0;
    const listo = r.progreso >= 1;
    return '<li class="cli"><div class="cli-h"><strong>' + esc(l.nombre) + '</strong><span class="num muted">' + fechaCorta(l.fecha) + '</span></div>' +
      '<p class="note">Pagaste ' + fmt(l.costo) + ' por ' + l.unidades + ' unidades. Vendes a ' + fmt(l.precio) + '.</p>' +
      '<div class="medidor' + (listo ? ' lleno' : '') + '" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + Math.round(pc) + '" aria-label="Avance para recuperar ' + esc(l.nombre) + '"><span style="width:' + pc.toFixed(1) + '%"></span></div>' +
      '<p style="margin-top:8px"><strong>' + (listo ? 'Ya recuperaste lo que pagaste.' : 'Te faltan ' + fmt(r.falta) + ' para recuperar.') + '</strong> ' +
      (r.recuperaEn ? (listo ? 'Lo que vendas desde ahora es ganancia, menos tus gastos.' : 'Vendiste ' + l.vendidas + ' de ' + r.recuperaEn + ' unidades para recuperar.') : '') + '</p>' +
      '<div class="contador"><span class="lbl">Vendidas: <b class="num">' + l.vendidas + '</b> de ' + l.unidades + '</span>' +
      '<button type="button" class="btn btn-ghost" data-act="lote-sumar" data-id="' + esc(l.id) + '" data-n="-1" aria-label="Restar una unidad">−1</button>' +
      '<button type="button" class="btn" data-act="lote-sumar" data-id="' + esc(l.id) + '" data-n="1">+1</button>' +
      '<button type="button" class="btn" data-act="lote-sumar" data-id="' + esc(l.id) + '" data-n="5">+5</button>' +
      '<button type="button" class="btn btn-danger" data-act="lote-borrar" data-id="' + esc(l.id) + '">Borrar</button></div></li>';
  }).join('');
  return '<h1>Recuperar un lote</h1>' +
    '<p class="lead">Si compraste un fardo, una caja o un lote completo, mira cuántas unidades tienes que vender para recuperar lo que pagaste antes de gastar la ganancia.</p>' +
    '<div class="dos" style="margin-top:16px"><form class="panel" id="f-lote" novalidate>' +
    '<label class="campo"><span class="lbl">¿Qué compraste?</span><input type="text" name="nombre" maxlength="50" autocomplete="off" placeholder="Por ejemplo, Fardo de ropa"></label>' +
    '<div class="grid2"><label class="campo"><span class="lbl">Pagaste en total</span><input type="text" inputmode="decimal" name="costo" autocomplete="off" placeholder="0"><span class="ayuda">Suma el transporte si lo pagaste aparte.</span></label>' +
    '<label class="campo"><span class="lbl">Unidades que vienen</span><input type="text" inputmode="numeric" name="unidades" autocomplete="off" placeholder="0"><span class="ayuda">Solo las que se pueden vender.</span></label></div>' +

    '<div class="grid2"><label class="campo"><span class="lbl">Cuotas que ya pagas al mes</span><input type="text" inputmode="decimal" name="actuales" autocomplete="off" value="' + actuales + '">' + (deMisDeudas ? '<span class="ayuda">Incluye tus deudas anotadas, pasadas a meses.</span>' : '') + '</label>' +
    '<label class="campo"><span class="lbl">Límite prudente (%)</span><input type="text" inputmode="decimal" name="limite" autocomplete="off" value="50"><span class="ayuda">Parte de lo que te sobra que podrías usar en cuotas. Es un supuesto, ajústalo.</span></label></div>' +
